<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Joey's Reading Room</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600&family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,700;1,9..144,400&display=swap" rel="stylesheet">
<style>
:root{
  --wall:#161B2E; --wall2:#10152A; --card:#242C4D; --card2:#2C3560; --line:#38426E;
  --ink:#EDE6D6; --mute:#A5ABC6; --amber:#F2C879; --amber2:#D9A441;
  --wood1:#9A6C44; --wood2:#6E482B; --wood3:#43291A;
  --leaf1:#2F6B42; --leaf2:#4C9160; --leaf3:#7DBB82; --pink:#E7A3B4;
  --serif:"Fraunces",Georgia,serif; --sans:"Figtree",system-ui,sans-serif;
  --glow:0 0 0 1px rgba(242,200,121,.45), 0 0 34px 6px rgba(242,200,121,.20), 0 0 80px 14px rgba(242,200,121,.09);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;overflow-x:hidden;color:var(--ink);font:15px/1.5 var(--sans);-webkit-font-smoothing:antialiased;min-height:100vh;
  background:radial-gradient(1100px 520px at 50% -8%,#2A3361 0%,transparent 62%),var(--wall)}
button,select,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
a{color:inherit}

/* masthead */
.mast{position:relative;background:linear-gradient(#0E1224,#141A30);padding:30px 24px 0;z-index:4;border-bottom:3px solid var(--wood2)}
.mast-in{max-width:1240px;margin:0 auto;position:relative;z-index:2}
.mast h1{font:700 clamp(34px,5.4vw,54px)/1 var(--serif);margin:0;letter-spacing:-.015em;color:#F6E7BD;text-shadow:0 0 28px rgba(242,200,121,.35)}
.mast p.sub{margin:10px 0 0;color:var(--mute);max-width:56ch}
.mast-top{display:flex;gap:28px;align-items:flex-end;justify-content:space-between;flex-wrap:wrap}
.slip{display:flex;gap:14px;background:var(--card);border:1px solid var(--line);padding:12px 18px 12px 12px;border-radius:10px;max-width:420px;cursor:pointer;text-align:left;transition:box-shadow .25s,transform .25s}
.slip:hover{box-shadow:var(--glow);transform:translateY(-2px)}
.slip b{font:700 16px/1.25 var(--serif);display:block}
.slip small{display:block;color:var(--mute)}
.slip .tag{font:600 13px var(--sans);color:var(--amber);margin-bottom:3px;display:block}
.tabs{display:flex;gap:6px;margin:26px 0 0}
.tabs button{background:transparent;border:0;color:var(--mute);padding:12px 18px 13px;font:600 15px var(--sans);cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-3px}
.tabs button[aria-selected=true]{color:var(--amber);border-bottom-color:var(--amber)}
.tabs button:hover:not([aria-selected=true]){color:#fff}
#vh{position:absolute;left:0;right:0;bottom:-74px;height:120px;width:100%;pointer-events:none;z-index:3}

main{max-width:1240px;margin:0 auto;padding:62px 24px 90px}

/* controls */
.bar{position:sticky;top:0;z-index:9;padding:12px 0;display:flex;flex-wrap:wrap;gap:10px 12px;align-items:center;background:linear-gradient(rgba(22,27,46,.97),rgba(22,27,46,.9));backdrop-filter:blur(6px);border-bottom:1px solid var(--line)}
.bar input[type=search]{flex:1 1 240px;min-width:180px;padding:9px 12px;border:1px solid var(--line);background:var(--card);border-radius:8px}
.bar input::placeholder{color:#8088AA}
.bar select{padding:9px 28px 9px 10px;border:1px solid var(--line);background:var(--card);border-radius:8px}
.bar option{background:#242C4D}
.seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--card)}
.seg button{border:0;background:transparent;padding:8px 13px;cursor:pointer;color:var(--mute)}
.seg button[aria-pressed=true]{background:var(--amber);color:#2A1D07;font-weight:600}
.chk{display:flex;gap:7px;align-items:center;color:var(--mute);font-size:14px;cursor:pointer;user-select:none}
.chk input{accent-color:var(--amber2);width:16px;height:16px}
.count{color:var(--mute);font-size:14px;margin:18px 0 14px}

/* covers */
.cv{position:relative;aspect-ratio:2/3;border-radius:2px 5px 5px 2px;overflow:hidden;background:var(--c,#3B4F6B);box-shadow:inset 4px 0 0 rgba(255,255,255,.13),inset -1px 0 0 rgba(0,0,0,.25),0 2px 4px rgba(0,0,0,.45)}
.cv .fb{position:absolute;inset:6% 8% 6% 12%;border:1px solid rgba(242,200,121,.55);display:flex;flex-direction:column;justify-content:space-between;align-items:center;text-align:center;padding:10% 6%;color:#F6EBCB;overflow:hidden}
.cv .ft{font:700 clamp(9px,1.05vw,14px)/1.18 var(--serif);display:-webkit-box;-webkit-line-clamp:6;-webkit-box-orient:vertical;overflow:hidden}
.cv .fa{font:italic 400 clamp(8px,.85vw,11.5px)/1.2 var(--serif);opacity:.85;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.cv .sp{position:absolute;inset:0;background-size:1000% 1000%;background-repeat:no-repeat;z-index:1;opacity:0;transition:opacity .3s}
.cv .sp.on{opacity:1}
.cv .exb{position:absolute;right:0;top:0;background:#9B2F45;color:#fff;font:600 10px/1 var(--sans);padding:3px 5px;border-radius:0 0 0 4px;z-index:2}
.big .cv .ft{font-size:20px}.big .cv .fa{font-size:13px}

/* stars */
.st{position:relative;display:inline-block;font-size:14px;letter-spacing:1px;line-height:1;color:#4C5686;white-space:nowrap}
.st i{position:absolute;left:0;top:0;overflow:hidden;color:var(--amber);font-style:normal;white-space:nowrap}
.num{font-variant-numeric:tabular-nums;color:var(--mute);font-size:13px;margin-left:5px}
.unr{color:var(--mute);font-size:13px;font-style:italic}
.ex{display:inline-block;font:600 11px/1 var(--sans);border:1px solid #E27D93;color:#F0A0B2;padding:2px 5px;border-radius:3px;margin-left:6px;vertical-align:1px}
.g{font-size:13px;color:var(--mute)}
.gd{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;background:var(--c)}

/* bookcase */
.case{position:relative;padding:0 38px;background:linear-gradient(90deg,rgba(0,0,0,.35),rgba(0,0,0,.12) 8%,rgba(0,0,0,.12) 92%,rgba(0,0,0,.35)),#0C1022;box-shadow:inset 0 14px 22px -10px rgba(0,0,0,.7)}
.case .up{position:absolute;top:-6px;bottom:-6px;width:30px;background:linear-gradient(90deg,var(--wood3),var(--wood1) 45%,var(--wood2) 70%,var(--wood3));box-shadow:0 0 18px rgba(0,0,0,.6);z-index:1}
.case .up.l{left:-2px;border-radius:5px 0 0 5px}.case .up.r{right:-2px;border-radius:0 5px 5px 0}
.case .cap{position:absolute;left:-12px;right:-12px;top:-14px;height:16px;background:linear-gradient(var(--wood1),var(--wood2) 60%,var(--wood3));border-radius:5px;box-shadow:0 6px 12px rgba(0,0,0,.5);z-index:2}
.case .vs{position:absolute;top:-6px;bottom:0;width:96px;pointer-events:none;z-index:3;overflow:visible}
.case .vs.l{left:-34px}.case .vs.r{right:-34px}
.shelf{position:relative;z-index:0}
.books{display:flex;gap:var(--gap,16px);align-items:flex-end;padding:26px 0 0;min-height:60px}
.bk{flex:none;width:var(--bw,130px);background:none;border:0;padding:0;cursor:pointer;display:block;transition:transform .18s}
.bk:hover,.bk:focus-visible{transform:translateY(-7px)}
.bk .cv{box-shadow:inset 4px 0 0 rgba(255,255,255,.13),0 3px 5px rgba(0,0,0,.55)}
.bk:hover .cv{box-shadow:inset 4px 0 0 rgba(255,255,255,.13),0 0 22px rgba(242,200,121,.5)}
.plank{height:20px;margin:0 -38px;background:linear-gradient(#B88454 0,#9A6C44 18%,#6E482B 70%,#43291A 100%);border-top:1px solid #C99565;box-shadow:0 12px 16px -4px rgba(0,0,0,.6);position:relative;z-index:1}
.plank::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,rgba(0,0,0,.06) 0 2px,transparent 2px 9px);mix-blend-mode:multiply}
.case.flat{background:none;box-shadow:none;padding:0}
.case.flat .up,.case.flat .cap,.case.flat .vs{display:none}

/* list */
.list{margin-top:4px;display:grid;gap:12px}
.row{display:grid;grid-template-columns:64px 1fr auto;gap:18px;padding:14px 18px 14px 14px;background:var(--card);border:1px solid var(--line);border-radius:10px;cursor:pointer;width:100%;text-align:left;align-items:center;transition:box-shadow .25s,transform .25s}
.row:hover{box-shadow:var(--glow);transform:translateY(-2px)}
.row h3{font:700 17px/1.25 var(--serif);margin:0}
.row .au{color:var(--mute)}
.row .meta{text-align:right;font-size:13px;color:var(--mute);min-width:150px}
.row .meta .st{margin-bottom:4px}
.row .rv{font:italic 14px/1.45 var(--serif);color:#C9CDE0;margin-top:5px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;max-width:70ch}

/* table */
.tw{overflow-x:auto;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:6px 10px}
table{border-collapse:collapse;width:100%;min-width:760px}
th{font:600 13px var(--sans);text-align:left;color:var(--mute);padding:10px;border-bottom:2px solid var(--amber2);white-space:nowrap}
th button{all:unset;cursor:pointer}
th button:hover{color:#fff}
th[aria-sort] button::after{content:" ▾";color:var(--amber)}
th[aria-sort=ascending] button::after{content:" ▴"}
td{padding:7px 10px;border-bottom:1px solid var(--line);vertical-align:middle;font-size:14px}
tr.tr{cursor:pointer}tr.tr:hover td{background:var(--card2)}
td .cv{width:30px}
td.t{font:700 14px/1.3 var(--serif);min-width:220px}
td.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}

/* stats */
.sgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:24px;margin-top:6px}
.sgrid .span4{grid-column:1/-1}
.sgrid .span2{grid-column:span 2}
.sc{position:relative;background:linear-gradient(180deg,var(--card2),var(--card));border:1px solid var(--line);border-radius:14px;padding:22px 24px 24px;transition:box-shadow .3s,transform .3s,border-color .3s}
.sc:hover{box-shadow:var(--glow);transform:translateY(-3px);border-color:rgba(242,200,121,.5)}
.sc.k{text-align:center;padding:26px 16px}
.sc.k b{display:block;font:700 clamp(32px,4vw,46px)/1.05 var(--serif);color:var(--amber);font-variant-numeric:lining-nums tabular-nums}
.sc.k span{color:var(--mute);font-size:14px}
.sc h2{font:700 20px/1.2 var(--serif);margin:0 0 4px;color:#F6E7BD}
.sc p.cap{margin:0 0 18px;color:var(--mute);font-size:13.5px;max-width:68ch}
.hb{display:grid;grid-template-columns:minmax(100px,230px) 1fr 40px;gap:9px 12px;align-items:center;font-size:14px}
.hb .lab{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hb .trk{height:16px;position:relative;background:rgba(255,255,255,.04);border-radius:0 6px 6px 0}
.hb .bar2{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,var(--amber2),var(--amber));border-radius:0 6px 6px 0;min-width:3px}
.hb .v{text-align:right;font-variant-numeric:tabular-nums;color:var(--mute)}
.hb .r{display:contents}
.hb .r:hover .bar2{filter:brightness(1.2)}
svg text{font:12px var(--sans);fill:var(--mute)}
.ybar:hover rect.m,.ybar:hover path.m{filter:brightness(1.25)}
.tip{position:fixed;pointer-events:none;background:#0B0F20;border:1px solid var(--line);color:var(--ink);font-size:13px;padding:7px 10px;border-radius:7px;z-index:30;display:none;max-width:260px;box-shadow:0 6px 20px rgba(0,0,0,.5)}
.tip b{font:700 14px var(--serif);display:block}
.prof{margin:0;padding:0;list-style:none;display:grid;gap:14px}.prof li{padding-left:18px;position:relative;line-height:1.5}.prof li::before{content:'';position:absolute;left:0;top:.62em;width:7px;height:7px;border-radius:50%;background:var(--amber)}.prof b{color:var(--amber);font-weight:600}
.note{color:var(--mute);font-size:13px;margin-top:28px;max-width:78ch}

/* detail */
.scrim{position:fixed;inset:0;background:rgba(6,9,20,.7);z-index:20;display:none;align-items:center;justify-content:center;padding:18px}
.scrim.on{display:flex}
.dlg{background:linear-gradient(180deg,var(--card2),var(--card));border:1px solid rgba(242,200,121,.4);box-shadow:var(--glow);max-width:780px;width:100%;max-height:92vh;overflow:auto;border-radius:14px;padding:28px;display:grid;grid-template-columns:200px 1fr;gap:26px;position:relative}
.dlg .x{position:absolute;right:12px;top:8px;border:0;background:none;font-size:28px;line-height:1;cursor:pointer;color:var(--mute)}
.dlg h2{font:700 27px/1.15 var(--serif);margin:0 0 4px;color:#F6E7BD}
.dlg .ser{color:var(--amber);font-weight:600;font-size:14px}
.dlg .au2{font-size:16px;color:var(--mute);margin-bottom:10px}
.dlg dl{display:grid;grid-template-columns:auto 1fr;gap:3px 14px;margin:14px 0;font-size:14px}
.dlg dt{color:var(--mute)}.dlg dd{margin:0}
.dlg h4{font:600 13px var(--sans);color:var(--amber);margin:18px 0 4px}
.dlg .txt{font:400 15px/1.6 var(--serif);white-space:pre-wrap;max-width:62ch;color:#E3DECF}
.empty{padding:60px 0;color:var(--mute)}
.hid{display:none!important}
@media (max-width:900px){.sgrid{grid-template-columns:repeat(2,1fr)}.sgrid .span4{grid-column:1/-1}}
@media (max-width:640px){
  .dlg{grid-template-columns:1fr}.dlg .cv{max-width:150px}
  .row{grid-template-columns:48px 1fr}.row .meta{grid-column:2;text-align:left}
  .sgrid{grid-template-columns:1fr}.sgrid .span2{grid-column:1/-1}
  .case{padding:0 26px}.plank{margin:0 -26px}.case .up{width:20px}.case .vs{width:70px}.case .vs.l{left:-26px}.case .vs.r{right:-26px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>
</head>

<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <symbol id="lf" viewBox="0 -8 22 16"><path d="M0,0 C5,-8 15,-8 21,0 C15,8 5,8 0,0Z"/><path d="M1,0 L18,0" stroke="rgba(0,0,0,.28)" stroke-width="1" fill="none"/></symbol>
</defs></svg>
<header class="mast"><div class="mast-in">
  <div class="mast-top">
    <div>
      <h1>Joey's Reading Room</h1>
      <p class="sub" id="sub"></p>
    </div>
    <button class="slip hid" id="now" aria-label="Currently reading"></button>
  </div>
  <div class="tabs" role="tablist">
    <button role="tab" id="tab-shelves" aria-selected="true">Shelves</button>
    <button role="tab" id="tab-stats" aria-selected="false">Statistics</button>
  </div>
</div><svg id="vh" aria-hidden="true"></svg></header>

<main>
  <div class="bar" id="bar">
    <input type="search" id="q" placeholder="Search title, author, series, review" aria-label="Search">
    <select id="genre" aria-label="Genre"></select>
    <select id="aud" aria-label="Audience">
      <option value="">All ages</option><option>Adult</option><option>Young Adult</option><option>Middle Grade</option>
    </select>
    <select id="shelf" aria-label="Shelf">
      <option value="read">Read</option><option value="to-read">Want to read</option><option value="did-not-finish">Did not finish</option><option value="all">All shelves</option>
    </select>
    <select id="sort" aria-label="Sort by">
      <option value="recent">Date read</option><option value="added">Date added</option><option value="rating">Rating</option>
      <option value="title">Title</option><option value="author">Author</option><option value="pages">Pages</option><option value="year">Published</option>
    </select>
    <div class="seg" id="views" role="group" aria-label="View">
      <button data-v="grid" aria-pressed="true">Shelves</button><button data-v="list" aria-pressed="false">List</button><button data-v="table" aria-pressed="false">Table</button>
    </div>
    <label class="chk"><input type="checkbox" id="kids"> Include childhood series</label>
    <label class="chk"><input type="checkbox" id="noex"> Hide explicit</label>
  </div>

  <section id="shelves">
    <div class="count" id="count"></div>
    <div class="case" id="case">
      <div class="cap"></div><div class="up l"></div><div class="up r"></div>
      <svg class="vs l" id="vl" aria-hidden="true"></svg><svg class="vs r" id="vr" aria-hidden="true"></svg>
      <div id="out"></div>
    </div>
  </section>

  <section id="stats" class="hid" aria-label="Statistics"></section>
</main>

<div class="scrim" id="scrim"><div class="dlg" id="dlg" role="dialog" aria-modal="true"></div></div>
<div class="tip" id="tip"></div>

etting out a breath and not knowing when the next one will come. It’s the feeling you get when your friend is going away for a long time and it feels like they’re leaving forever. It’s the soul crushing reality of growing up and moving on and realizing you’re going to have to leave some things behind. Or else you’ll never grow. I got so attached to these characters so quickly and their story was breathtaking and exciting and scary and anxious. <br/><br/>This series took me by surprise. It has an awesome premise and after getting into the first one, I was hooked by the world building and the characters and the magic, but also the writing. Schwab has such a way with syntax and emotional build up and really soul crushing metaphors that get you involved and KEEP you involved. <br/><br/>I can’t say enough good things about this book/series. I really can’t. It’s one I’m going to remember forever and I am so glad I picked it up.","i":"9780765387462","y":2017,"g":"Contemporary Fantasy","au":"Young Adult","h":0,"x":0,"i10":"0765387468"},{"id":"20764879","t":"A Gathering of Shadows","se":"Shades of Magic","sn":"2","a":"V.E. Schwab","r":5.0,"p":512,"dr":"2018-04-04","da":"2018-04-03","sh":"read","b":"Hardcover","rv":"Even more exhilarating than the first! The world building is absolutely incredible, and Schwab has such a way with story-telling that it’s completely enrapturing. The action and the political intrigue are done with equal amounts of suspense and thrill. This installment made me adore Rhy even more and even feel a bit bad for Holland! The tendency of fantasy authors to rely too heavily on romance is completely avoided here. It’s present (along with incorporating at least two bisexual characters without hurrah - thank you for that) but is never the main focus of the story. Two characters have a quick but meaningful discussion about the forms love can take, which I adored. It’s not always flowers and smiles, sometimes love is getting angry at someone because they put themselves in danger. The magical elements brought such an edge to the story but also filled it with this visceral feeling of awe and wonder. Overall an excellent read and I am SO glad I bought the next one already because I’ll be starting it immediately!","i":"9780765376473","y":2016,"g":"Contemporary Fantasy","au":"Young Adult","h":0,"x":0,"i10":"0765376474"},{"id":"22055262","t":"A Darker Shade of Magic","se":"Shades of Magic","sn":"1","a":"V.E. Schwab","r":5.0,"p":400,"dr":"2018-04-02","da":"2018-03-29","sh":"read","b":"Hardcover","rv":"This was a great story! I’ve seen the series around lately and decided to give it a go and I really enjoyed this one! It was fast paced enough to keep me interested but still took the time to explain the magic and the worlds. I loved Kell but I REALLY loved Lila. An absolute spitfire. Also, Rhy stole my heart and I wish he had more page time. I’d love to learn more about him in the next books! Overall, an exciting and fantastical story and a definite recommend!","i":"9780765376459","y":2015,"g":"Contemporary Fantasy","au":"Young Adult","h":0,"x":0,"i10":"0765376458"},{"id":"17855756","t":"Dust","se":"Silo","sn":"3","a":"Hugh Howey","r":4.0,"p":458,"dr":"2017-03-26","da":"2017-02-27","sh":"read","b":"Paperback","rv":"","i":"9781490904382","y":2013,"g":"Dystopian","au":"Adult","h":0,"x":0,"i10":"1490904387"},{"id":"17306293","t":"Shift","se":"Silo","sn":"2","a":"Hugh Howey","r":5.0,"p":579,"dr":"2017-03-18","da":"2017-02-27","sh":"read","b":"Kindle Edition","rv":"","i":"","y":2013,"g":"Dystopian","au":"Adult","h":0,"x":0,"i10":""},{"id":"58733693","t":"Remarkably Bright Creatures","se":"","sn":"","a":"Shelby Van Pelt","r":5.0,"p":360,"dr":"2023-06-30","da":"2023-06-28","sh":"read","b":"Hardcover","rv":"","i":"9780063204157","y":2022,"g":"Contemporary Fiction","au":"Adult","h":0,"x":0,"i10":"0063204150"},{"id":"52578297","t":"The Midnight Library","se":"The Midnight World","sn":"1","a":"Matt Haig","r":4.0,"p":288,"dr":"2023-06-27"," buse way. I loved Alex from the start. She’s super relatable but has also seen some shit. She fluctuates between “maybe I need to do better...” and “Fuck this, I am a badass.” Which I adored. <br/><br/>The story gripped me and I loved the look into the ancient societies we all have heard about. I loved the set up and the premise for why she comes to Yale and what they do as a society, but this was also a mystery novel that I definitely did not guess the answer to. It goes back and forth and throws you for a loop so many times that I wasn’t sure WHO had done WHAT. But it kept me enthralled the entire time and I am so hurt that the storyline didn’t wrap up but I am thrilled that there will be a sequel! I can’t wait to see more adult works from Bardugo in the future!","i":"9781250313072","y":2019,"g":"Contemporary Fantasy","au":"Adult","h":0,"x":0,"i10":"1250313074"},{"id":"38730623","t":"Home After Dark","se":"","sn":"","a":"David Small","r":4.0,"p":416,"dr":"2019-10-28","da":"2019-10-28","sh":"read","b":"Hardcover","rv":"This is probably the first graphic fiction I’ve actually finished. It’s a story about a young boy trying to find his way but hit with loss after loss. It was very gritty in its realistic portrayal of brutal middle school boys and life in poverty during the mid century. It was a quick read (only took me around 35 minutes) but I thought it was quite impactful.","i":"9780871403155","y":2018,"g":"Contemporary Fiction","au":"Young Adult","h":0,"x":0,"i10":"0871403153"},{"id":"43798285","t":"The Institute","se":"","sn":"","a":"Stephen King","r":5.0,"p":561,"dr":"2019-10-10","da":"2019-10-08","sh":"read","b":"Hardcover","rv":"","i":"","y":2019,"g":"Horror","au":"Adult","h":0,"x":0,"i10":""},{"id":"13541056","t":"Queen of Air and Darkness","se":"The Dark Artifices","sn":"3","a":"Cassandra Clare","r":4.0,"p":893,"dr":"2019-07-26","da":"2019-07-25","sh":"read","b":"Kindle Edition","rv":"So. To be clear, I read Lord of Shadows (book 2 of this series) the day it came out and in a single sitting. And I sobbed at the end. And then...I forgot about this series to be honest. This book came out and it was so huge I didn’t have time to really devote to it. I finally gathered the courage and got the audiobook and finished it this week. It took a few chapters to get back into the story, but this finale was SO jam packed with...EVERYTHING. So incredibly much happened and I won’t say I’m 100% satisfied with the ending. It was great, don’t get me wrong, and I definitely teared up multiple times, but there were a few big issues I took with character choices. Some of these characters really deserved better. And I was heartbroken that they got this ending, regardless of any unnamed ‘future’. Despite all that, it was very typical Shadowhunter novel. A mix of action and angelic douchebaggery and some humor in all the darkness. overall, if you like any of the other novels by Clare, you’ll love this one.","i":"9781442468450","y":2018,"g":"Contemporary Fantasy","au":"Young Adult","h":0,"x":0,"i10":"1442468459"},{"id":"37969723","t":"The Silence of the Girls","se":"Women of Troy","sn":"1","a":"Pat Barker","r":5.0,"p":325,"dr":"2019-08-08","da":"2018-09-21","sh":"read","b":"Hardcover","rv":"What a gorgeous story! As I’m sure you all can tell, I love a Greek retelling. This one is the story of the Iliad from Briseis’s POV. from her story in her homeland all the way through the end of the story, it’s such an amazing perspective on the story that almost never gets told. There are a million retellings of this story, but so few that center on the women who experienced it. I really loved seeing one of my favorite stories from a whole new point of view with a whole new attitude on everything. All of the women were so varied and beautiful and contributory that it became such a beautiful tapestry of experiences. I’ve been looking forward to this one for a while and I really loved it!","i":"","y":2018,"g":"Mythological Retellings","au":"Adult","h":0,"x":0,"i10":""},{"id":"17333223","t":"The Goldfinch","se":"","sn":"","a":"Donna Tartt","r":4.0,"p":775,"dr":"2019-09-05","da":"2019-08-08","sh":"read","b":"Hardcover","rv":"So, funny story. I read this book on accident. I got the audio thinking it was a different book by the same author, and about 7 hours into the audio I really started questioning what I was listening to because it was not going where I expected the plot to go. Turns out, I meant to get The Secret History but got confused and started this one instead. Oops!<br/>.<br/>The only real feedback I can give on this book (because I did finish it - I had already committed seven hours of audio!) is that it was SO. TEDIOUSLY. SLOW. It’s set as a frame story, with much of the prose being a lead up from Theo’s initial tragedy to his current point. Unfortunately, that took up damn near 26 hours of the audio. It was an incredibly detailed and explorative section that really dug deep on the characters, but after a while I was really wondering when we were going to get back to the initial scenario.<br/>.<br/>All in all, it was a book about obsession and how it works into our hearts and heads, and about addiction, and longing, and loss. It has some fantastically beautiful prose with great meaning to internalize. Which is why it still gets a 4/5. A great work, but you have to be very patient with it.","i":"9780316055437","y":2013,"g":"Contemporary Fiction","au":"Adult","h":0,"x":0,"i10":"0316055433"},{"id":"29044","t":"The Secret History","se":"","sn":"","a":"Donna Tartt","r":5.0,"p":559,"dr":"2019-09-21","da":"2019-05-16","sh":"read","b":"Paperback","rv":"What a heart wrenching story! I’ve been dying to read this for ages because it has that dark academia allure that I love coupled with the study of Ancient Greek and legendary old literature. I absolutely adored the characters, flaws included. I knew where the story was going to the main climax in the middle but it was still so poetic and powerful. Every page of this book enchanted me and I am so glad I’ve finally read it. To be honest, I’m really not sure how to move on. How can I read another book when I’ll be comparing it to this one? I’m so upset that it’s over. 😭","i":"9781400031702","y":1992,"g":"Contemporary Fiction","au":"Adult","h":0,"x":0,"i10":"1400031702"},{"id":"15824358","t":"The First 90 Days: Proven Strategies for Getting Up to Speed Faster and Smarter","se":"","sn":"","a":"Michael D. Watkins","r":3.0,"p":304,"dr":"2019-08-05","da":"2019-05-27","sh":"read","b":"Hardcover","rv":"","i":"9781422188613","y":2003,"g":"Nonfiction","au":"Adult","h":0,"x":0,"i10":"1422188612"},{"id":"17334061","t":"The Last Stand of the New York Institute","se":"The Bane Chronicles","sn":"9","a":"Cassandra Clare","r":0.0,"p":40,"dr":"","da":"2019-07-25","sh":"read","b":"ebook","rv":"","i":"9781442495654","y":2013,"g":"Contemporary Fantasy","au":"Young Adult","h":0,"x":0,"i10":""},{"id":"17334063","t":"Saving Raphael Santiago","se":"The Bane Chronicles","sn":"6","a":"Cassandra Clare","r":0.0,"p":40,"dr":"","da":"2019-07-25","sh":"read","b":"ebook","rv":"","i":"9781442495616","y":2013,"g":"Contemporary Fantasy","au":"Young Adult","h":0,"x":0,"i10":"1442495618"},{"id":"17334065","t":"The Course of True Love [and First Dates]","se":"The Bane Chronicles","sn":"10","a":"Cassandra Clare","r":0.0,"p":40,"dr":"","da":"2019-07-25","sh":"read","b":"ebook","rv":"","i":"","y":2014,"g":"Contemporary Fantasy","au":"Young Adult","h":0,"x":0,"i10":""},{"id":"17334066","t":"What to Buy the Shadowhunter Who Has Everything","se":"The Bane Chronicles","sn":"8","a":"Cassandra Clare","r":0.0,"p":40,"dr":"","da":"2019-07-25","sh":"read","b":"ebook","rv":"","i":"9781442495647","y":2013,"g":"Contemporary Fantasy","au":"Young Adult","h":0,"x":0,"i10":"1442495642"},{"id":"23381009","t":"The Fiery Trial","se":"Tales from the Shadowhunter Academy","sn":"8","a":"Cassandra Clare","r":0.0,"p":64,"dr":"","da":"2019-07-25","sh":"read","b":"ebook","rv":"","i":"","y":2015,"g  in the next one, otherwise I might get too bored to finish.","i":"9780670022410","y":2011,"g":"Contemporary Fantasy","au":"Adult","h":0,"x":0,"i10":"0670022411"},{"id":"40187791","t":"Storm Forged","se":"The Darkest Storm","sn":"1","a":"Patrick Dugan","r":2.0,"p":300,"dr":"2019-01-19","da":"2019-01-19","sh":"read","b":"Kindle Edition","rv":"","i":"","y":2018,"g":"Sci-Fi","au":"Adult","h":0,"x":0,"i10":""},{"id":"35403058","t":"City of Ghosts","se":"Cassidy Blake","sn":"1","a":"Victoria Schwab","r":5.0,"p":272,"dr":"2018-10-05","da":"2018-10-04","sh":"read","b":"Kindle Edition","rv":"","i":"9781338111033","y":2018,"g":"Contemporary Fantasy","au":"Young Adult","h":0,"x":0,"i10":"1338111035"},{"id":"35378411","t":"The Shades of Magic Series","se":"Shades of Magic","sn":"1-3","a":"V.E. Schwab","r":0.0,"p":1534,"dr":"","da":"2018-10-04","sh":"read","b":"Kindle Edition","rv":"","i":"","y":2016,"g":"Contemporary Fantasy","au":"Young Adult","h":0,"x":0,"i10":""},{"id":"35879387","t":"The Price Guide to the Occult","se":"","sn":"","a":"Leslye Walton","r":3.0,"p":272,"dr":"2018-10-03","da":"2018-10-01","sh":"read","b":"Hardcover","rv":"","i":"9780763691103","y":2018,"g":"Contemporary Fantasy","au":"Adult","h":0,"x":0,"i10":"0763691100"},{"id":"26856502","t":"Vengeful","se":"Villains","sn":"2","a":"V.E. Schwab","r":5.0,"p":462,"dr":"2018-09-30","da":"2018-09-27","sh":"read","b":"Kindle Edition","rv":"","i":"","y":2018,"g":"Contemporary Fantasy","au":"Young Adult","h":0,"x":0,"i10":""},{"id":"72579","t":"Alias Grace","se":"","sn":"","a":"Margaret Atwood","r":4.0,"p":468,"dr":"2018-09-22","da":"2018-09-17","sh":"read","b":"Hardcover","rv":"","i":"9780385475716","y":1996,"g":"Contemporary Fiction","au":"Adult","h":0,"x":0,"i10":"0385475713"},{"id":"38447","t":"The Handmaid’s Tale","se":"The Handmaid's Tale","sn":"1","a":"Margaret Atwood","r":5.0,"p":311,"dr":"2018-08-20","da":"2018-08-16","sh":"read","b":"Paperback","rv":"","i":"9780385490818","y":1985,"g":"Dystopian","au":"Adult","h":0,"x":0,"i10":"038549081X"},{"id":"40874032","t":"Vicious","se":"Villains","sn":"1","a":"V.E. Schwab","r":5.0,"p":402,"dr":"2018-08-15","da":"2018-08-13","sh":"read","b":"Kindle Edition","rv":"","i":"","y":2013,"g":"Contemporary Fantasy","au":"Young Adult","h":0,"x":0,"i10":""},{"id":"30809786","t":"A Reaper at the Gates","se":"An Ember in the Ashes","sn":"3","a":"Sabaa Tahir","r":5.0,"p":458,"dr":"2018-08-07","da":"2018-08-01","sh":"read","b":"Hardcover","rv":"","i":"9780448494500","y":2018,"g":"High Fantasy","au":"Young Adult","h":0,"x":0,"i10":"0448494507"},{"id":"25558608","t":"A Torch Against the Night","se":"An Ember in the Ashes","sn":"2","a":"Sabaa Tahir","r":5.0,"p":464,"dr":"2018-07-31","da":"2018-07-28","sh":"read","b":"Hardcover","rv":"","i":"9780008250447","y":2016,"g":"High Fantasy","au":"Young Adult","h":0,"x":0,"i10":""},{"id":"27774758","t":"An Ember in the Ashes","se":"An Ember in the Ashes","sn":"1","a":"Sabaa Tahir","r":4.0,"p":446,"dr":"2018-07-27","da":"2018-07-25","sh":"read","b":"Paperback","rv":"","i":"","y":2015,"g":"High Fantasy","au":"Young Adult","h":0,"x":0,"i10":""},{"id":"27883214","t":"Caraval","se":"Caraval","sn":"1","a":"Stephanie Garber","r":2.0,"p":407,"dr":"2018-05-23","da":"2018-05-02","sh":"read","b":"Hardcover","rv":"Just really not for me. I didn’t buy any of it and it just seemed...I’m not sure. Bleh, is the best I can muster. Not worth the time I spent on it. Won’t be reading the sequel.","i":"9781250095251","y":2016,"g":"Romantasy","au":"Young Adult","h":0,"x":0,"i10":"1250095255"},{"id":"27188596","t":"War Storm","se":"Red Queen","sn":"4","a":"Victoria Aveyard","r":5.0,"p":662,"dr":"2018-05-22","da":"2018-05-15","sh":"read","b":"Hardcover","rv":"First of all, this book was massive. I knew a lot had to happen before there would be a satisfying ending but sheesh, 650+ pages was a lot. That being said, Aveyard really poured herself into this one. I felt like King’s Cage was a bit lackluster, but this one certainly made up for it. This was quite the action-packed finale. I don’t wanna spoil too much, but the thrilling mix of war and political intrigue, with bloody betrayal and the heavy weight of doing what is right even when it means turning your back on everything you’ve ever known, made this book an absolute page turner. Even after 650+ pages, I still felt like so much more could have been done! So many twists and turns and unexpected outcomes and behind the scenes plots made me really really love this ending. I never would have predicted the full outcome of this series just by reading the first book, and that in itself is a testament to this series.","i":"9780062422996","y":2018,"g":"Fantasy Adventure","au":"Young Adult","h":0,"x":0,"i10":"0062422995"},{"id":"31117613","t":"Tin Man","se":"","sn":"","a":"Sarah Winman","r":5.0,"p":213,"dr":"2018-05-10","da":"2018-05-10","sh":"read","b":"Paperback","rv":"‘And I wonder what the sound of a heart breaking might be. And I think it might be quiet, unperceptively so, and not dramatic at all. Like the sound of an exhausted swallow falling gently to earth.’<br/><br/>I finished this book in a single sitting because...it was just so intoxicating. It follows the story of two men and their complicated relationship through the span of several decades. It is absolutely jam packed with incredible and beautiful imagery, both of English countryside and French retreats. It is also absolutely and incredibly emotional. Every 30 pages I was tearing up. Ellis and Michael go through a tumultuous time, but this story is beautiful and centers around art and color and life, and takes places in a time where it’s not so acceptable for boys to love those things, much less other boys. <br/><br/>I absolutely recommend this book - it’s a super short read (barely over 200 pages) - but probably one of the most deeply impactful and emotional ones I’ve read in recent years.<br/><br/>‘It is for them now, the beauty of discovery, that endless moonscape of life unfolding.’","i":"9780755390960","y":2017,"g":"Contemporary Fiction","au":"Adult","h":0,"x":0,"i10":"0755390962"},{"id":"35959740","t":"Circe","se":"","sn":"","a":"Madeline Miller","r":5.0,"p":393,"dr":"2018-05-01","da":"2018-04-30","sh":"read","b":"Hardcover","rv":"‘But in a solitary life, there are rare moments when another soul dips near yours, as stars once a year brush the earth. Such a constellation was he to me.’<br/><br/>What a powerful story and so full of beautiful imagery and wonderful prose. A true and emotional coming of age of a divine being who does not, in fact, age. Circe’s story is so wrought with grief and turmoil but also little glimpses of hope and power as she grows into the Witch of Aiaia. I loved her from the start and as she spent her centuries on her island I grew to love her as she grew to love herself. She is a divine entity who struggles with mortal issues like loneliness, her family, lost love. I loved the tidbits from other Greek mythology and how they entwined with Circe and her story. This was a true epic story for her that gives her the credit she deserves for everything she went through. I absolutely loved it.<br/><br/>‘I had kept away from him for many reasons. Because I was a god and he a man. But it struck me then that at the root of all those reasons was a sort of fear. And I have never been a coward. I reached across that breathing air between us and found him.’","i":"9780316556347","y":2018,"g":"Mythological Retellings","au":"Adult","h":0,"x":0,"i10":"0316556343"},{"id":"11250317","t":"The Song of Achilles","se":"","sn":"","a":"Madeline Miller","r":5.0,"p":352,"dr":"2018-04-27","da":"2018-04-25","sh":"read","b":"Hardcover","rv":"Obviously we all know how the Iliad goes. We know how it ends. But the getting there...that’s what made this retelling so much more heartbreaking. I absolutely loved this story. I’ve always loved Greek mythology and the Iliad in particular, but this version was absolutely stunning. A vivid history of Patroclus and Achilles, it really gives depth and emotion to a well known tale about glory and death. And even though we all know how it ends, it doesn’t make it hurt any less.","i":"9781408816035","y":2011,"g":"Mythological Retellings","au":"Adult","h":0,"x":0,"i10":"1408816032"},{"id":"30226723","t":"King's Cage","se":"Red Queen","sn":"3","a":"Victoria Aveyard","r":4.0,"p":520,"dr":"2018-04-25","da":"2018-04-22","sh":"read","b":"ebook","rv":"","i":"9780062310712","y":2017,"g":"Fantasy Adventure","au":"Young Adult","h":0,"x":0,"i10":"0062310712"},{"id":"23174274","t":"Glass Sword","se":"Red Queen","sn":"2","a":"Victoria Aveyard","r":4.0,"p":444,"dr":"2018-04-21","da":"2018-04-19","sh":"read","b":"Hardcover","rv":"","i":"9780062310668","y":2016,"g":"Fantasy Adventure","au":"Young Adult","h":0,"x":0,"i10":"0062310666"},{"id":"22328546","t":"Red Queen","se":"Red Queen","sn":"1","a":"Victoria Aveyard","r":5.0,"p":388,"dr":"2018-04-18","da":"2018-04-17","sh":"read","b":"Hardcover","rv":"","i":"9780062310637","y":2015,"g":"Fantasy Adventure","au":"Young Adult","h":0,"x":0,"i10":"0062310631"},{"id":"35051065","t":"The Rogue Queen","se":"The Hundredth Queen","sn":"3","a":"Emily R. King","r":3.0,"p":303,"dr":"2018-04-16","da":"2018-04-15","sh":"read","b":"Kindle Edition","rv":"","i":"9781542098342","y":2018,"g":"Romantasy","au":"Young Adult","h":0,"x":0,"i10":"1542098343"},{"id":"34314702","t":"The Fire Queen","se":"The Hundredth Queen","sn":"2","a":"Emily R. King","r":3.0,"p":277,"dr":"2018-04-11","da":"2018-04-10","sh":"read","b":"Paperback","rv":"","i":"9781611097498","y":2017,"g":"Romantasy","au":"Young Adult","h":0,"x":0,"i10":"1611097495"},{"id":"32852217","t":"The Hundredth Queen","se":"The Hundredth Queen","sn":"1","a":"Emily R. King","r":3.0,"p":287,"dr":"2018-04-09","da":"2018-04-09","sh":"read","b":"Paperback","rv":"","i":"9781503943650","y":2017,"g":"Romantasy","au":"Young Adult","h":0,"x":0,"i10":"1503943658"},{"id":"34275232","t":"The Hazel Wood","se":"The Hazel Wood","sn":"1","a":"Melissa Albert","r":4.0,"p":359,"dr":"2018-03-27","da":"2018-03-27","sh":"read","b":"Hardcover","rv":"What a weird, wild story this was. I picked it up on a whim this morning because I’d seen it all over bookstagram and the like, but it was not at all what I expected. It had such a strange feel to it that kept me feeling so unstable. The writing was well done and Alice’s journey in the Hazel Wood had me completely thrown - unexpected turns left and right that lent a very good ‘other-worldly’ feel to the novel. Which, obviously, was the point. I didn’t think I’d finish it in a day, but it was too intriguingly weird to put down! Overall, a good read for boggling your own mind.","i":"9781250147905","y":2018,"g":"Contemporary Fantasy","au":"Adult","h":0,"x":0,"i10":"1250147905"},{"id":"26156203","t":"The Crown's Game","se":"The Crown's Game","sn":"1","a":"Evelyn Skye","r":3.0,"p":407,"dr":"2018-02-06","da":"2018-01-29","sh":"read","b":"Hardcover","rv":"Unfortunately, I just didn’t love this book. I bought the set a few weeks ago with my sister because they sounded interesting, but man. What a let down. This series reads like a underdeveloped spinoff of the #GrishaTrilogy. It’s Russian, based on magic, and involves a girl getting caught between two dudes she can’t pick. And of course she’s super powerful and a force to be reckoned with. It has a fairly good premise - the Russian Tsar needs an Imperial Enchanter, so the two enchanters blessed with magic have to duel to the death to win the title. Like if the #Grisha series met #ThroneofGlass. But it’s just so...empty? There’s little to no explanation for any of their magic, or how or why it can be done. They just cast totally random ‘charms’ and ‘enchantments’ willy nilly! The characters fall in love the first second they meet, and it’s just so cliché? I don’t know.","i":"9780062422583","y":2016,"g":"High Fantasy","au":"Young Adult","h":0,"x":0,"i10":"0062422588"},{"id":"27211901","t":"The Crown's Fate","se":"The Crown's Game","sn":"2","a":"Evelyn Skye","r":1.0,"p":425,"dr":"2018-02-23","da":"2018-02-06","sh":"read","b":"Hardcover","rv":"This book just could not hold my attention. I had so many issues with the first one but I’m too much of a completionist not to finish the second book. I got about 100 pages in and just stalled. hard. It took me forever to pick it back up and even then I trudged through it. It was just so...under developed and lacking any real depth or world building that I honestly just dragged myself to the finish line. Maybe I need to work on my ability to DNF books.","i":"9780062422613","y":2017,"g":"High Fantasy","au":"Young Adult","h":0,"x":0,"i10":"0062422618"},{"id":"32320661","t":"Everless","se":"Everless","sn":"1","a":"Sara Holland","r":4.0,"p":362,"dr":"2018-03-08","da":"2018-03-06","sh":"read","b":"Hardcover","rv":"To be honest, I wasn’t expecting much from this book. Seemed like yet another cheesy YA story packed full of tropes. Hence why I’m just now getting around to reading my ARC of it I got months ago. The world building was a little confusing, trying to visualize how to turn ‘time’ into ‘blood-iron’ via some mysterious alchemical process that isn’t fully explained. Once I stopped trying to figure out the specifics of how that worked, the story wasn’t bad actually. I liked all the characters, was mildly interested in the plot, and found myself saying ‘why not read another chapter?’ Typical 3 star review. But MAN, the last few chapters had me hooked! The plot twists left and right and the revelations all overlapping into this frenzy of panic and danger and action really pushed this book to a 4 star. I was floored by the ending and now I’m gonna have to wait another year for the sequel (🙄)! While there are definitely some gaps in logic and places where she could have spent a few more pages allowing the main character to come to realizations, it was overall solid. I liked it way more than I anticipated and I definitely recommend it!","i":"9780062653659","y":2018,"g":"Romantasy","au":"Young Adult","h":0,"x":0,"i10":"0062653652"},{"id":"35924698","t":"The Witch Doesn't Burn in This One","se":"Women Are Some Kind of Magic","sn":"2","a":"Amanda Lovelace","r":5.0,"p":192,"dr":"2018-03-12","da":"2018-03-12","sh":"read","b":"Paperback","rv":"I liked this one much better than her first. It has a very powerful female message and the whole things reads like a social commentary through a ‘fairy tale’ lens. I really liked that she took care to include women of color and trans women instead of making this ‘white girl central.’ She encourages women to step up and defend themselves but also warns against burning everything down - ‘do not lose empathy.’ Overall a great read that I’d recommend to any of my lady friends.","i":"9781449489427","y":2018,"g":"Poetry","au":"Adult","h":0,"x":0,"i10":"1449489427"},{"id":"29906017","t":"Reign of the Fallen","se":"Reign of the Fallen","sn":"1","a":"Sarah Glenn Marsh","r":5.0,"p":384,"dr":"2018-03-20","da":"2018-03-17","sh":"read","b":"Hardcover","rv":"I adored this book. Truly a work about grief and its consequences, but built effortlessly into a world that seemed so natural to me. The world building was clear without being overdone, and much of the prose wasn’t devoted to explaining every minute detail of the magic involved. A large chunk of the book is about loss and how people deal with that differently, but it never felt oppressive to me, or took too much away from the actual plot. I got this book in my @pagehabit box last month and I’m so glad I read it without shelving it forever! One of my favorite things is fantasy novels that incorporate LGBT+ characters, and it was done so smoothly in this novel. No stereotypical tropes or foolishness, just queer people being themselves. I didn’t read any reviews before I started this, and I’m so glad that I got the pleasant surprise of so many queer characters. The lack of sexual diversity in the fantasy genre is a big problem (especially in YA novels), so I’m SO glad I found one that I loved without even realizing it. A definite recommend!","i":"9780448494395","y":2018,"g":"High Fantasy","au":"Young Adult","h":0,"x":0,"i10":"0448494396"},{"id":"19547856","t":"Simon vs. the Homo Sapiens Agenda","se":"Simonverse","sn":"1","a":"Becky Albertalli","r":5.0,"p":320,"dr":"","da":"2018-03-27","sh":"read","b":"Hardcover","rv":"This book was so close to my heart. I don’t really have the words to describe how accurately this book portrayed a lot of things about coming out as a teenager in a public school in the South. Having gone through that exact experience myself, so much about this book hit home for me. I could feel all of Simon’s anxiety and I remember his fears because they were mine ten years ago. The soul crushing horror of the thought of exposing yourself as gay in a place where that is not the norm. The incredible awkwardness of trying to come out to your closest friends. The parents who try too hard. I loved this book so much. I read almost all of it in a single sitting because it was SO real and I truly saw myself reflected in Simon’s life. For anyone who has come out or is considering coming out, read this book. It’s more than a cheesy love story. It’s an accurate (albeit toned down) depiction of the gay experience in the South.","i":"9780062348678","y":2015,"g":"Contemporary Fiction","au":"Young Adult","h":0,"x":0,"i10":"0062348671"},{"id":"34728667","t":"Children of Blood and Bone","se":"Legacy of Orïsha","sn":"1","a":"Tomi Adeyemi","r":5.0,"p":544,"dr":"2018-03-27","da":"2018-03-25","sh":"read","b":"Hardcover","rv":"What a breathtaking book! The story is so well done but so far from anything I’ve ever read. Basing this fantasy in African lore and influence made it all the more interesting for me because I’ve never read anything like it. Zélie’s heartbreak and sorrow are so incredibly real and the cast of characters is so wide and truly encompassing. I can’t say enough good things about this story. The last 30 pages had me tearing up, both with sorrow and with pride. I don’t want to spoil anything too drastic but I absolutely adored this work and it is ESPECIALLY important to recognize its current political implications. Adeyemi wrote this book as an inspirational tool for black people to know that they have the power to stand up to what’s happening in our country. And even though I’m not black, the emotional impact of this story cut me to the core. I suggest you ALL read this and think hard about what it really means. We are all children of blood and bone.","i":"9781250170972","y":2018,"g":"High Fantasy","au":"Young Adult","h":0,"x":0,"i10":"1250170974"},{"id":"310259","t":"Love You Forever","se":"","sn":"","a":"Robert Munsch","r":5.0,"p":32,"dr":"","da":"2018-03-23","sh":"read","b":"Paperback","rv":"","i":"9780920668375","y":1986,"g":"Contemporary Fiction","au":"Middle Grade","h":0,"x":0,"i10":"0920668372"},{"id":"22299763","t":"Crooked Kingdom","se":"Six of Crows","sn":"2","a":"Leigh Bardugo","r":5.0,"p":561,"dr":"2018-01-23","da":"2018-01-23","sh":"read","b":"Kindle Edition","rv":"","i":"","y":2016,"g":"High Fantasy","au":"Young Adult","h":0,"x":0,"i10":""},{"id":"23437156","t":"Six of Crows","se":"Six of Crows","sn":"1","a":"Leigh Bardugo","r":4.0,"p":465,"dr":"2018-01-22","da":"2018-01-15","sh":"read","b":"Hardcover","rv":"","i":"9781627792127","y":2015,"g":"High Fantasy","au":"Young Adult","h":0,"x":0,"i10":"1627792120"},{"id":"14061957","t":"Ruin and Rising","se":"Shadow and Bone","sn":"3","a":"Leigh Bardugo","r":5.0,"p":432,"dr":"2018-01-14","da":"2018-01-14","sh":"read","b":"Hardcover","rv":"","i":"","y":2014,"g":"High Fantasy","au":"Young Adult","h":0,"x":0,"i10":""},{"id":"14061955","t":"Siege and Storm","se":"The Shadow and Bone Trilogy","sn":"2","a":"Leigh Bardugo","r":5.0,"p":435,"dr":"2018-01-14","da":"2018-01-12","sh":"read","b":"Hardcover","rv":"","i":"","y":2013,"g":"High Fantasy","au":"Young Adult","h":0,"x":0,"i10":""},{"id":"10194157","t":"Shadow and Bone","se":"Shadow and Bone","sn":"1","a":"Leigh Bardugo","r":4.0,"p":358,"dr":"2018-01-11","da":"2018-01-11","sh":"read","b":"Hardcover","rv":"","i":"9781250048110","y":2012,"g":"High Fantasy","au":"Young Adult","h":0,"x":0,"i10":"1250048117"},{"id":"30025336","t":"All the Crooked Saints","se":"","sn":"","a":"Maggie Stiefvater","r":4.0,"p":313,"dr":"2018-01-09","da":"2018-01-02","sh":"read","b":"Hardcover","rv":"","i":"9780545930802","y":2017,"g":"Contemporary Fantasy","au":"Young Adult","h":0,"x":0,"i10":"0545930804"},{"id":"30075802","t":"The Princess Saves Herself in This One","se":"Women Are Some Kind of Magic","sn":"1","a":"Amanda Lovelace","r":3.0,"p":156,"dr":"2018-01-02","da":"2018-01-02","sh":"read","b":"Paperback","rv":"Not my favorite poetry book of late, but not terrible. Felt a little simplistic in parts a la Milk and Honey, but deeply emotional in others. The sense of loss was very real for me but overall it seemed to lack a single direction or focus. There were a few sections where I wasn’t sure if she was talking about her father or a lover. Maybe that was intentional. Who knows? Overall though, pretty good - just not as personally relatable to me.","i":"9781532913686","y":2016,"g":"Poetry","au":"Adult","h":0,"x":0,"i10":"1532913680"},{"id":"17378527","t":"The Raven King","se":"The Raven Cycle","sn":"4","a":"Maggie Stiefvater","r":5.0,"p":439,"dr":"2018-01-02","da":"2017-12-30","sh":"read","b":"Hardcover","rv":"4.5/5 for this one. This book was almost perfect. The storyline of the previous three books finally comes to a climax but with all these added elements of danger and surprise and the ever present looming threat of death. I found the slow build romance done well for the main couple, despite it being wildly predictable since book one. The magical elements enhanced the story enough that I wasn’t constantly focused on the underlying love story, which I very much appreciated. What I did not enjoy, however, was how the /* ---------- vines ---------- */
function rng(seed){ return ()=>{ seed|=0; seed=seed+0x6D2B79F5|0; let t=Math.imul(seed^seed>>>15,1|seed); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
const LEAF=['#2F6B42','#3E8052','#4C9160','#5FA56D','#7DBB82'];
function leaf(x,y,ang,len,r){ const h=len*16/22; return `<use href="#lf" x="${x.toFixed(1)}" y="${(y-h/2).toFixed(1)}" width="${len.toFixed(1)}" height="${h.toFixed(1)}" transform="rotate(${ang.toFixed(0)} ${x.toFixed(1)} ${y.toFixed(1)})" fill="${LEAF[Math.floor(r()*LEAF.length)]}"/>`; }
function flower(x,y){ return `<g><circle cx="${x}" cy="${y}" r="4.2" fill="#E7A3B4"/><circle cx="${x}" cy="${y}" r="1.6" fill="#F2C879"/></g>`; }
function vinesH(svg,W){
  const H=120, base=48, r=rng(11); svg.setAttribute('viewBox',`0 0 ${W} ${H}`); svg.setAttribute('height',H);
  let pts=[]; for(let x=-10;x<=W+10;x+=10) pts.push(`${x},${(base+Math.sin(x/64)*5+Math.sin(x/23)*2).toFixed(1)}`);
  let o=`<polyline points="${pts.join(' ')}" fill="none" stroke="#2A6040" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/>`;
  for(let x=6;x<W;x+=24){ const y=base+Math.sin(x/64)*5+Math.sin(x/23)*2; const up=r()<.5; o+=leaf(x,y,up?-(35+r()*50):(35+r()*55),up?8+r()*5:13+r()*8,r); }
  for(let x=20;x<W;x+=40+r()*70){
    const y0=base+Math.sin(x/64)*5, len=26+r()*70, dx=(r()-.5)*34, cx=x+dx*.2, cy=y0+len*.55, ex=x+dx, ey=y0+len;
    o+=`<path d="M${x.toFixed(1)},${y0.toFixed(1)} Q${cx.toFixed(1)},${cy.toFixed(1)} ${ex.toFixed(1)},${ey.toFixed(1)}" fill="none" stroke="#2F6B42" stroke-width="2" stroke-linecap="round"/>`;
    const n=Math.floor(len/15);
    for(let i=1;i<=n;i++){ const t=i/(n+1), px=(1-t)*(1-t)*x+2*(1-t)*t*cx+t*t*ex, py=(1-t)*(1-t)*y0+2*(1-t)*t*cy+t*t*ey; o+=leaf(px,py,(i%2?38:142)+(r()-.5)*30,11+r()*7,r); }
    o+=leaf(ex,ey,90+(r()-.5)*40,10+r()*5,r); if(r()<.22) o+=flower(ex.toFixed(1),(ey+5).toFixed(1));
  }
  svg.innerHTML=o;
}
function vinesV(svg,H,side){
  const W=96, cx=47, r=rng(side==='l'?3:29); svg.setAttribute('viewBox',`0 0 ${W} ${H}`); svg.setAttribute('width',W); svg.setAttribute('height',H);
  const sx=y=>cx+Math.sin(y/55)*5+Math.sin(y/17)*1.6; let pts=[]; for(let y=-6;y<=H+6;y+=10) pts.push(`${sx(y).toFixed(1)},${y}`);
  let o=`<polyline points="${pts.join(' ')}" fill="none" stroke="#2A6040" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"/>`;
  for(let y=8,i=0;y<H;y+=17+r()*8,i++){ const x=sx(y), left=i%2===0; o+=leaf(x,y,(left?180:0)+(r()-.5)*70+(r()<.5?25:-25),(left?13:11)+r()*9,r); }
  for(let y=30;y<H;y+=75+r()*70){ const x=sx(y), out=r()<.7?(side==='l'?-1:1):(side==='l'?1:-1), len=(out===(side==='l'?-1:1))?30+r()*30:14+r()*10, dy=-8-r()*14;
    const ex=x+out*len, ey=y+dy;
    o+=`<path d="M${x.toFixed(1)},${y} Q${(x+out*len*.6).toFixed(1)},${(y+4).toFixed(1)} ${ex.toFixed(1)},${ey.toFixed(1)}" fill="none" stroke="#2F6B42" stroke-width="2" stroke-linecap="round"/>`;
    const k=Math.max(1,Math.floor(len/13)); for(let j=1;j<=k;j++){ const t=j/(k+1); o+=leaf(x+(ex-x)*t,y+(ey-y)*t+(4*(1-t)*t*2),(out>0?0:180)+(j%2?-35:35)+(r()-.5)*20,9+r()*6,r); }
    o+=leaf(ex,ey,(out>0?0:180)+(r()-.5)*30,10+r()*4,r); if(r()<.28) o+=flower(ex.toFixed(1),(ey-3).toFixed(1));
  }
  svg.innerHTML=o;
}
function updateVines(){
  vinesH($('#vh'), Math.max(320,document.querySelector('.mast').clientWidth));
  const c=$('#case'); if(c.classList.contains('flat')||$('#shelves').classList.contains('hid')) return;
  const H=Math.min(20000,c.offsetHeight+10); vinesV($('#vl'),H,'l'); vinesV($('#vr'),H,'r');
}

/* ---------- covers: baked into sprite sheets (covers/sheet-N.jpg), summaries baked into data/extra.json ---------- */
let EX = {};
const COLS = 10;
const OWN = new Set(['10025305','10194157','10572','10664113','10803121','10852065','10929432','11250317','11350430','11559200','11985631','12127810','12287209','13496','13497','13578175','13638131','13643876','15724396','1582996','163977','17306293','17334061','17334063','17334064','17334065','17334068','17334074','17334077','17334079','17855756','17927395','18635622','2120932','21411388','22328546','22428828','22544764','22823333','228665','22878967','228928465','23380998','23380999','23381005','23381006','23381007','23381009','23381012','23381014','24365190','247756858','25494343','25558608','28016509','28260587','28954137','303472','30809786','31117613','32307358','32852217','33257757','33357675','334643','33785695','34002132','35606560','37969723','39943621','40874032','41564599','4556058','4837112','49455','50156751','518848','54870256','561456','56377548','57443696','60648548','6149','61755703','6219656','62291','6752378','7235533','7896527','8667848','8755776','8755785']); /* covers/<id>.webp: individual cover files, take priority over the sprite sheets */
function coverHTML(b){
  const c = GC[b.g]||'#3B4F6B', e = EX[b.id];
  const sp = OWN.has(String(b.id)) ? `<span class="sp" data-own="${b.id}" style="background-size:cover;background-position:center"></span>` : e && e[0]>=0 ? `<span class="sp" data-sheet="${e[0]}" style="background-position:${(e[1]%COLS)/(COLS-1)*100}% ${Math.floor(e[1]/COLS)/(COLS-1)*100}%"></span>` : '';
  return `<div class="cv" style="--c:${c}"><div class="fb"><span class="ft">${esc(b.t)}</span><span class="fa">${esc(b.a)}</span></div>${sp}${b.x?'<span class="exb">Explicit</span>':''}</div>`;
}
const io = 'IntersectionObserver' in window ? new IntersectionObserver(es=>es.forEach(e=>{ if(e.isIntersecting){ io.unobserve(e.target); loadSprite(e.target);} }),{rootMargin:'500px'}) : null;
function loadSprite(sp){
  const url = sp.dataset.own ? `covers/${sp.dataset.own}.webp` : `covers/sheet-${sp.dataset.sheet}.jpg`, im = new Image();
  im.onload = ()=>{ sp.style.backgroundImage=`url(${url})`; sp.classList.add('on'); };
  im.src = url;
}
function observeCovers(root){ root.querySelectorAll('.sp[data-sheet],.sp[data-own]').forEach(i=>{ io?io.observe(i):loadSprite(i); }); }

/* ---------- bits ---------- */
function stars(r){ return r>0 ? `<span class="st" role="img" aria-label="${r} out of 5">★★★★★<i style="width:${r/5*100}%">★★★★★</i></span><span class="num">${r%1?r.toFixed(2).replace(/0$/,''):r.toFixed(1)}</span>` : `<span class="unr">Unrated</span>`; }
const exTag = b => b.x ? '<span class="ex">Explicit</span>' : '';
const gTag = b => `<span class="g"><span class="gd" style="--c:${GC[b.g]||'#999'}"></span>${esc(b.g)}${b.au!=='Adult'?' · '+esc(b.au):''}</span>`;
const serTxt = b => b.se ? b.se+(b.sn?' #'+b.sn:'') : '';
const tip = $('#tip');
function showTip(e,html){ tip.innerHTML=html; tip.style.display='block'; const w=tip.offsetWidth; tip.style.left=Math.max(6,Math.min(innerWidth-w-8,e.clientX+14))+'px'; tip.style.top=(e.clientY+16)+'px'; }
function hideTip(){ tip.style.display='none'; }

/* ---------- filtering ---------- */
function visible(){
  const q = S.q.trim().toLowerCase();
  return BOOKS.filter(b=>{
    if(!S.kids && b.h) return false;
    if(S.noex && b.x) return false;
    if(S.shelf!=='all' && b.sh!==S.shelf) return false;
    if(S.genre && b.g!==S.genre) return false;
    if(S.aud && b.au!==S.aud) return false;
    if(q && !(b.t+' '+b.a+' '+b.se+' '+b.rv).toLowerCase().includes(q)) return false;
    return true;
  });
}
const cmp = {
  recent:(a,b)=> (b.dr||'').localeCompare(a.dr||'') || (b.dr?0:(b.da||'').localeCompare(a.da||'')) || a.t.localeCompare(b.t),
  added:(a,b)=> (b.da||'').localeCompare(a.da||'') || a.t.localeCompare(b.t),
  rating:(a,b)=> b.r-a.r || a.t.localeCompare(b.t),
  title:(a,b)=> a.t.localeCompare(b.t),
  author:(a,b)=> a.a.localeCompare(b.a) || a.t.localeCompare(b.t),
  pages:(a,b)=> b.p-a.p,
  year:(a,b)=> b.y-a.y
};

/* ---------- shelves render ---------- */
function render(){
  const list = visible().sort((a,b)=>S.dir*cmp[S.sort](a,b));
    $('#count').textContent = `${list.length.toLocaleString()} book${list.length===1?'':'s'}`;
  const out = $('#out'), cs=$('#case');
  cs.classList.toggle('flat', S.view!=='grid');
  if(!list.length){ out.innerHTML = '<div class="empty">Nothing matches those filters. Clear the search or choose All ages.</div>'; cs.classList.add('flat'); return; }
  if(S.view==='grid'){
    const W=out.clientWidth||900, gap=W<560?10:16, minBw=W<560?92:128, n=Math.max(2,Math.floor((W+gap)/(minBw+gap))), bw=(W-(n-1)*gap)/n;
    out.style.setProperty('--bw',bw.toFixed(1)+'px'); out.style.setProperty('--gap',gap+'px');
    let h=''; for(let i=0;i<list.length;i+=n){ h+='<div class="shelf"><div class="books">'+list.slice(i,i+n).map(b=>`<button class="bk" data-id="${b.id}" aria-label="${esc(b.t)} by ${esc(b.a)}">${coverHTML(b)}</button>`).join('')+'</div><div class="plank"></div></div>'; }
    out.innerHTML=h;
  } else if(S.view==='list'){
    out.innerHTML = '<div class="list">'+list.map(b=>`<button class="row" data-id="${b.id}">${coverHTML(b)}<div><h3>${esc(b.t)}${exTag(b)}</h3><div class="au">${esc(b.a)}${b.se?' · '+esc(serTxt(b)):''}</div>${gTag(b)}${b.rv?`<div class="rv">${esc(b.rv.replace(/<br\s*\/?>/gi,' '))}</div>`:''}</div><div class="meta">${stars(b.r)}<div>${b.p?b.p+' pages':''}</div><div>${b.dr?'Read '+fmtDate(b.dr):''}</div></div></button>`).join('')+'</div>';
  } else {
    const cols=[['',''],['Title','title'],['Author','author'],['Genre',''],['Rating','rating'],['Pages','pages'],['Published','year'],['Read','recent'],['Added','added']];
    out.innerHTML = '<div class="tw"><table><thead><tr>'+cols.map(([l,k])=>`<th ${k&&S.sort===k?`aria-sort="${S.dir>0?'descending':'ascending'}"`:''}>${k?`<button data-k="${k}">${l}</button>`:l}</th>`).join('')+'</tr></thead><tbody>'+
      list.map(b=>`<tr class="tr" data-id="${b.id}"><td>${coverHTML(b)}</td><td class="t">${esc(b.t)}${exTag(b)}</td><td>${esc(b.a)}</td><td>${gTag(b)}</td><td class="n">${b.r?b.r:'–'}</td><td class="n">${b.p||'–'}</td><td class="n">${b.y||'–'}</td><td class="n">${fmtDate(b.dr)||'–'}</td><td class="n">${fmtDate(b.da)}</td></tr>`).join('')+'</tbody></table></div>';
  }
  observeCovers(out); updateVines();
}

/* ---------- detail ---------- */
function openBook(id){
  const b = byId[id]; if(!b) return;
  hideTip();
  const rv = b.rv.replace(/<br\s*\/?>/gi,'\n');
  $('#dlg').innerHTML = `<button class="x" aria-label="Close">×</button><div class="big">${coverHTML(b)}</div><div>
    ${b.se?`<div class="ser">${esc(serTxt(b))}</div>`:''}<h2>${esc(b.t)}</h2><div class="au2">${esc(b.a)}</div>
    <div>${stars(b.r)}${exTag(b)}</div>
    <dl><dt>Genre</dt><dd>${gTag(b)}</dd><dt>Pages</dt><dd>${b.p||'Unknown'}</dd><dt>Published</dt><dd>${b.y||'Unknown'}</dd>
    ${b.dr?`<dt>Finished</dt><dd>${fmtDate(b.dr)}</dd>`:''}<dt>Added</dt><dd>${fmtDate(b.da)}</dd>${b.p?`<dt>Est. listen</dt><dd>${(b.p/PPH).toFixed(1)} hours, from page count</dd>`:''}</dl>
    ${rv?`<h4>My review</h4><div class="txt">${esc(rv)}</div>`:''}
    <h4>Summary</h4><div class="txt">${esc((EX[b.id]&&EX[b.id][2])||'No summary available for this one.')}</div></div>`;
  $('#scrim').classList.add('on'); observeCovers($('#dlg')); $('#dlg .x').focus();
}
function closeBook(){ $('#scrim').classList.remove('on'); }

/* ---------- stats ---------- */
function hbars(rows){ const max=Math.max(...rows.map(r=>r[1]),1);
  return '<div class="hb">'+rows.map(([l,v])=>`<div class="r" data-t="${esc(l+': '+v)}"><div class="lab" title="${esc(l)}">${esc(l)}</div><div class="trk"><div class="bar2" style="width:${v/max*100}%"></div></div><div class="v">${v}</div></div>`).join('')+'</div>'; }
function renderStats(){
  const rd = BOOKS.filter(b=>b.sh==='read' && (S.kids||!b.h));
  const pages = rd.reduce((s,b)=>s+b.p,0), rated = rd.filter(b=>b.r>0);
  const avg = rated.reduce((s,b)=>s+b.r,0)/(rated.length||1);
  const noPages = rd.filter(b=>!b.p).length;
  const count = (arr,f)=>{ const m={}; arr.forEach(b=>{const k=f(b); m[k]=(m[k]||0)+1;}); return m; };
  const nowY=new Date().getFullYear(), yrs=[]; const cy = count(rd.filter(b=>b.dr&&+b.dr.slice(0,4)>=2017), b=>b.dr.slice(0,4));
  for(let y=2017;y<=nowY;y++) yrs.push([y,cy[y]||0]);
  const dated = yrs.reduce((s,r)=>s+r[1],0);
  const W=1000,H=250,L=36,Bm=30,T=12,pw=W-L-10, mx=Math.max(10,Math.ceil(Math.max(...yrs.map(r=>r[1]))/10)*10), step=mx<=40?10:20, bw=pw/yrs.length;
  let svg=`<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Books read per year from 2017"><defs><linearGradient id="bg1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F2C879"/><stop offset="1" stop-color="#C98F2E"/></linearGradient></defs>`;
  for(let t=0;t<=mx;t+=step){ const y=T+(H-T-Bm)*(1-t/mx); svg+=`<line x1="${L}" x2="${W-10}" y1="${y}" y2="${y}" stroke="#38426E" stroke-width="1"/><text x="${L-8}" y="${y+4}" text-anchor="end">${t}</text>`; }
  yrs.forEach(([y,v],i)=>{ const h=(H-T-Bm)*v/mx, x=L+i*bw+bw*.2, w=bw*.6, base=T+(H-T-Bm), yy=base-h, part=y===nowY;
    svg+=`<g class="ybar" data-t="${y}${part?' (so far)':''}: ${v} book${v===1?'':'s'}"><rect x="${L+i*bw}" y="${T}" width="${bw}" height="${H-T-Bm}" fill="transparent"/>${v?`<path class="m" d="M${x},${base} V${yy+5} a5,5 0 0 1 5,-5 h${w-10} a5,5 0 0 1 5,5 V${base} Z" fill="url(#bg1)" opacity="${part?.6:1}"/>`:''}</g><text x="${x+w/2}" y="${H-9}" text-anchor="middle">${y}</text>`; });
  svg+='</svg>';
  const rr=count(rated,b=>(Math.round(b.r*2)/2).toFixed(1)); const rrows=Object.keys(rr).sort((a,b)=>b-a).map(k=>[k+' stars',rr[k]]);
  let gg=Object.entries(count(rd,b=>b.g)).sort((a,b)=>b[1]-a[1]); if(gg.length>9){ const rest=gg.slice(8).reduce((s,r)=>s+r[1],0); gg=gg.slice(0,8).concat([['Other genres',rest]]); }
  const era=y=>y<1900?'Before 1900':y<1950?'1900–1949':y<1980?'1950–1979':y<2000?'1980–1999':y<2010?'2000s':y<2020?'2010s':'2020s';
  const eo=['Before 1900','1900–1949','1950–1979','1980–1999','2000s','2010s','2020s'], ec=count(rd.filter(b=>b.y),b=>era(b.y)); const erows=eo.map(k=>[k,ec[k]||0]);
  const au=Object.entries(count(rd,b=>b.a)).sort((a,b)=>b[1]-a[1]).slice(0,9);
  const srows=Object.entries(count(rd.filter(b=>b.se),b=>b.se)).sort((a,b)=>b[1]-a[1]).slice(0,9);
  const pct=(n,d)=>Math.round(n/(d||1)*100);
  const FAN=['High Fantasy','Fantasy Adventure','Contemporary Fantasy','Romantasy','Mythological Retellings'];
  const fanN=rd.filter(b=>FAN.includes(b.g)).length;
  const topFan=Object.entries(count(rd.filter(b=>FAN.includes(b.g)),b=>b.g)).sort((a,b)=>b[1]-a[1])[0];
  const five=rated.filter(b=>b.r>=5).length, four=rated.filter(b=>b.r>=4).length;
  const longest=rd.filter(b=>!/boxed set|omnibus|collection|complete|series$|trilogy/i.test(b.t)).reduce((m,b)=>b.p>m.p?b:m,{p:0,t:''});
  const modern=rd.filter(b=>b.y>=2000).length, withY=rd.filter(b=>b.y).length;
  const profile=`<ul class="prof">
    <li><b>${pct(fanN,rd.length)}%</b> of my shelf is fantasy in one form or another, and ${esc(topFan?topFan[0]:'fantasy')} leads the way.</li>
    <li><b>${esc(au[0]?au[0][0]:'')}</b> is my most-read author, with ${au[0]?au[0][1]:0} books.</li>
    <li>A generous grader: <b>${pct(five,rated.length)}%</b> of rated books earned five stars and <b>${pct(four,rated.length)}%</b> earned four or more.</li>
    <li><b>${pct(rd.filter(b=>b.se).length,rd.length)}%</b> of what I read belongs to a series. The longest single read was ${esc(longest.t||'')} at ${longest.p||0} pages.</li>
    <li><b>${pct(modern,withY)}%</b> of the books were published in 2000 or later.</li>
  </ul>`;
  $('#stats').innerHTML = `
  <div class="sgrid">
    <div class="sc k"><b>${rd.length.toLocaleString()}</b><span>books read</span></div>
    <div class="sc k"><b>${pages.toLocaleString()}</b><span>pages read</span></div>
    <div class="sc k"><b>${Math.round(pages/PPH).toLocaleString()}</b><span>hours, estimated from pages</span></div>
    <div class="sc k"><b>${avg.toFixed(2)}</b><span>average rating, ${rated.length} rated</span></div>
    <div class="sc span4"><h2>Books per year</h2><p class="cap">Counted from finish dates, 2017 on. Only ${dated} of ${rd.length} books carry a finish date; earlier ones were added in bulk, so the true pace is higher than this chart shows.</p>${svg}</div>
    <div class="sc span2"><h2>Genres</h2><p class="cap">What the shelves are made of.</p>${hbars(gg)}</div>
    <div class="sc span2"><h2>Most-read authors</h2><p class="cap">By number of books.</p>${hbars(au)}</div>
    <div class="sc span2"><h2>Ratings</h2><p class="cap">How I score what I finish.</p>${hbars(rrows)}</div>
    <div class="sc span2"><h2>Publication era</h2><p class="cap">When the books were first published.</p>${hbars(erows)}</div>
    <div class="sc span2"><h2>Reader profile</h2><p class="cap">What the numbers say about me.</p>${profile}</div>
    <div class="sc span2"><h2>Biggest series</h2><p class="cap">Series I've read the most books from.</p>${hbars(srows)}</div>
  </div>
  <p class="note">Listening time is an estimate at about ${PPH} pages per narrated hour${noPages?`; ${noPages} books have no page count and add nothing`:''}. It will be replaced with real Audible runtimes where they are available.</p>`;
  $('#stats').querySelectorAll('[data-t]').forEach(el=>{ el.addEventListener('mousemove',e=>showTip(e,esc(el.dataset.t))); el.addEventListener('mouseleave',hideTip); });
}

/* ---------- wiring ---------- */
function init(){
  const gs = Object.entries(BOOKS.reduce((m,b)=>(m[b.g]=(m[b.g]||0)+1,m),{})).sort((a,b)=>b[1]-a[1]);
  $('#genre').innerHTML = '<option value="">All genres</option>'+gs.map(([g])=>`<option value="${esc(g)}">${esc(g)}</option>`).join('');
  const n = BOOKS.filter(b=>b.sh==='read').length;
  $('#sub').textContent = `Heists, magic systems, and morally grey heroes. Everything I've read, shelved and rated.`;
  const cur = BOOKS.find(b=>b.sh==='currently-reading');
  if(cur){ const nw=$('#now'); nw.classList.remove('hid'); nw.innerHTML = `<div style="width:58px;flex:none">${coverHTML(cur)}</div><div><span class="tag">Now reading</span><b>${esc(cur.t)}</b><small>${esc(cur.a)}</small>${cur.se?`<small>${esc(serTxt(cur))}</small>`:''}</div>`; nw.onclick=()=>openBook(cur.id); observeCovers(nw); }
  $('#q').oninput = e=>{ S.q=e.target.value; render(); };
  ['genre','aud','shelf'].forEach(k=>$('#'+k).onchange=e=>{ S[k]=e.target.value; render(); });
  $('#sort').onchange = e=>{ S.sort=e.target.value; S.dir=1; render(); };
  $('#kids').onchange = e=>{ S.kids=e.target.checked; render(); if(!$('#stats').classList.contains('hid')) renderStats(); };
  $('#noex').onchange = e=>{ S.noex=e.target.checked; render(); };
  $('#views').onclick = e=>{ const v=e.target.dataset.v; if(!v) return; S.view=v; document.querySelectorAll('#views button').forEach(x=>x.setAttribute('aria-pressed',x.dataset.v===v)); render(); };
  const out=$('#out');
  out.onclick = e=>{
    const k=e.target.closest('[data-k]'); if(k){ const key=k.dataset.k; if(S.sort===key) S.dir*=-1; else { S.sort=key; S.dir=1; } $('#sort').value=key; render(); return; }
    const it=e.target.closest('[data-id]'); if(it) openBook(it.dataset.id);
  };
  const bkTip=(e,el)=>{ const b=byId[el.dataset.id]; showTip(e,`<b>${esc(b.t)}</b>${esc(b.a)}${b.r?`<br>★ ${b.r}`:''}`); };
  out.addEventListener('mousemove',e=>{ const el=e.target.closest('.bk'); el?bkTip(e,el):hideTip(); });
  out.addEventListener('mouseleave',hideTip);
  out.addEventListener('focusin',e=>{ const el=e.target.closest('.bk'); if(el){ const r=el.getBoundingClientRect(); bkTip({clientX:r.right-20,clientY:r.top},el);} });
  out.addEventListener('focusout',hideTip);
  $('#scrim').onclick = e=>{ if(e.target.id==='scrim'||e.target.classList.contains('x')) closeBook(); };
  document.addEventListener('keydown',e=>{ if(e.key==='Escape') closeBook(); });
  $('#tab-shelves').onclick=()=>go('shelves'); $('#tab-stats').onclick=()=>go('stats');
  addEventListener('hashchange',()=>go(location.hash.slice(1)||'shelves',true));
  let rt; addEventListener('resize',()=>{ clearTimeout(rt); rt=setTimeout(()=>{ if(!$('#shelves').classList.contains('hid')) render(); else updateVines(); },160); });
  if('ResizeObserver' in window) new ResizeObserver(()=>{ clearTimeout(window._vt); window._vt=setTimeout(updateVines,120); }).observe($('#case'));
  go(location.hash.slice(1)||'shelves',true);
  fetch('data/extra.json').then(r=>r.ok?r.json():null).then(j=>{ if(!j) return; EX=j.b||{}; if(cur){ $('#now').querySelector('div').innerHTML=coverHTML(cur); observeCovers($('#now')); } if(!$('#shelves').classList.contains('hid')) render(); }).catch(()=>{});
}
function go(p,fromHash){
  if(p!=='stats') p='shelves';
  $('#shelves').classList.toggle('hid',p!=='shelves'); $('#bar').classList.toggle('hid',p!=='shelves'); $('#stats').classList.toggle('hid',p!=='stats');
  $('#tab-shelves').setAttribute('aria-selected',p==='shelves'); $('#tab-stats').setAttribute('aria-selected',p==='stats');
  if(!fromHash) { try{ location.hash=p; }catch(e){} }
  if(p==='stats'){ renderStats(); updateVines(); } else render();
}
init();
</script>
</body>
</html>
