<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Joey's Reading Room</title>
<meta name="description" content="Reading, Collected. A personal archive of books, ratings, and reading history.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#08131B;--bg2:#10232B;--panel:#142C35;--gold:#E8B85F;--cream:#F4E6CA;--muted:#AAB8BA;--line:#29464C;--sel:#24535A;
--serif:'Cormorant Garamond',Georgia,serif;--sans:'Hanken Grotesk',system-ui,sans-serif;--hdr:64px;--bot:0px;--pv:0px;--r:14px}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
html[data-motion=reduced]{scroll-behavior:auto}
html[data-motion=reduced] *{transition:none!important;animation:none!important}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{transition:none!important;animation:none!important}}
body{margin:0;background:var(--bg);color:var(--cream);font:400 16px/1.55 var(--sans);-webkit-font-smoothing:antialiased;min-height:100dvh}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px;border-radius:6px}
.room{position:fixed;inset:0;z-index:-1;background:var(--bg) url(data/library.webp) center/cover no-repeat}
.room::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(8,19,27,.72),rgba(8,19,27,.9) 40%,rgba(8,19,27,.96))}
a{color:var(--gold)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* header + nav */
header.top::before{content:"";position:absolute;inset:0;z-index:0;background:url(data/floral.webp) center/612px auto repeat-x;opacity:.5;pointer-events:none;-webkit-mask-image:linear-gradient(90deg,transparent 20%,#000 31%,#000 45%,transparent 56%);mask-image:linear-gradient(90deg,transparent 20%,#000 31%,#000 45%,transparent 56%)}
header.top>*{position:relative;z-index:1}
header.top{position:sticky;top:var(--pv);z-index:40;height:var(--hdr);display:flex;align-items:center;gap:28px;padding:0 max(20px,calc((100% - 1240px)/2));background:linear-gradient(rgba(8,19,27,.94),rgba(8,19,27,.8));backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.brand{font:600 27px/1 var(--serif);color:var(--cream);text-decoration:none;white-space:nowrap;letter-spacing:.2px}
.brand small{display:block;font:500 11px/1.2 var(--sans);color:var(--muted);letter-spacing:.02em;margin-top:3px}
nav.main{display:flex;gap:4px;margin-left:auto}
nav.main a{display:flex;align-items:center;min-height:44px;padding:0 14px;border-radius:10px;color:var(--muted);text-decoration:none;font-weight:500;font-size:15px;position:relative}
nav.main a:hover{color:var(--cream)}
nav.main a[aria-current=page]{color:var(--gold)}
nav.main a[aria-current=page]::after{content:"";position:absolute;left:14px;right:14px;bottom:5px;height:2px;background:var(--gold);border-radius:2px}
.bottomnav{display:none}
main{max-width:1240px;margin:0 auto;padding:28px 20px 80px}
section.view{display:none}
section.view.on{display:block}
h1,h2,h3{font-family:var(--serif);font-weight:600;color:var(--cream);margin:0;line-height:1.05}
.eyebrow{color:var(--gold);font-weight:600;font-size:13px;letter-spacing:.04em}
.panel{background:rgba(16,35,43,.86);border:1px solid var(--line);border-radius:var(--r);backdrop-filter:blur(6px)}
.chip{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 16px;border:1px solid var(--line);border-radius:999px;background:rgba(20,44,53,.8);color:var(--cream);font-weight:500;font-size:14px}
.chip[aria-pressed=true],.chip.on{background:var(--sel);border-color:#3a7580}
.btn{text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 20px;border-radius:10px;border:1px solid var(--gold);background:var(--gold);color:#1a1405;font-weight:700}
.btn.ghost{background:transparent;color:var(--gold)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.note{color:var(--muted);font-size:13.5px}
.previewbar{position:sticky;top:0;z-index:45;height:var(--pv);display:flex;gap:10px;align-items:center;justify-content:center;background:#1d3a42;color:var(--cream);font-size:13px;padding:6px 14px;text-align:center}
.previewbar b{color:var(--gold)}

/* covers */
.cv{position:relative;aspect-ratio:2/3;border-radius:3px 6px 6px 3px;overflow:hidden;background:var(--c,#3B4F6B);box-shadow:0 6px 14px rgba(0,0,0,.45),inset 3px 0 0 rgba(255,255,255,.12)}
.cv .ft{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:8%;text-align:center;font:600 12px/1.2 var(--serif);color:#fff;word-break:break-word}
.cv .sp{position:absolute;inset:0;background-size:1200% 1400%;background-repeat:no-repeat}
button.cvb{border:0;background:none;padding:0;display:block;width:100%;border-radius:6px}
button.cvb:hover .cv{transform:translateY(-4px);box-shadow:0 12px 20px rgba(0,0,0,.55)}
.cv{transition:transform .18s,box-shadow .18s}
.stars{position:relative;display:inline-block;color:#31505a;letter-spacing:2px;font-size:16px;line-height:1}
.stars i{position:absolute;left:0;top:0;overflow:hidden;white-space:nowrap;color:var(--gold);font-style:normal}

/* home */
.mason{column-count:3;column-gap:18px}@media (max-width:1000px){.mason{column-count:2}}@media (max-width:640px){.mason{column-count:1}}.mason>.panel{break-inside:avoid;margin-bottom:18px;display:inline-block;width:100%}
.prose.pb{display:grid;grid-template-columns:repeat(3,1fr);gap:34px;margin-top:14px}.pcol h3{font:600 26px/1.1 var(--serif);color:var(--gold);margin:0 0 8px}.pcol p{margin:0;color:#d8d3c4;font:400 18px/1.6 var(--serif)}
@media (max-width:900px){.prose.pb{grid-template-columns:1fr;gap:20px}}
.hero .htext,.hero .now{position:relative;z-index:2}
.hero .htext{width:max-content;max-width:100%}.hero .htext h1{white-space:nowrap}.hero .htext p.lead{width:0;min-width:100%;max-width:none}
.hero{position:relative;border-radius:20px;overflow:hidden;border:1px solid var(--line);min-height:380px;display:grid;grid-template-columns:1.25fr 1fr;gap:28px;align-items:center;padding:44px 44px;
background:linear-gradient(90deg,rgba(8,19,27,.94) 0,rgba(8,19,27,.7) 52%,rgba(8,19,27,.28)),url(data/library.webp) center 38%/cover}
.hero h1{font-size:clamp(46px,6vw,78px);letter-spacing:-.5px;margin:0 0 14px}
.hero p.lead{font-size:18px;color:#d8d3c4;max-width:34ch;margin:0 0 6px}
.hero .tag{font:italic 500 21px/1.3 var(--serif);color:var(--gold)}
.now{display:flex;gap:18px;align-items:center;padding:18px;background:rgba(8,19,27,.72);backdrop-filter:blur(8px);border:1px solid rgba(232,184,95,.4);border-radius:16px;text-align:left;width:100%}
.now .cv{width:104px;flex:none}
.now h2{font-size:28px;margin:6px 0 4px}
.now .by{color:var(--muted);font-size:15px}
.now .by i{color:var(--cream)}
.pill{display:inline-block;padding:2px 10px;border-radius:999px;background:rgba(232,184,95,.14);color:var(--gold);font-size:12px;font-weight:600;border:1px solid rgba(232,184,95,.35)}
.statstrip{display:grid;grid-template-columns:repeat(5,1fr);margin:30px 0 12px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);background:rgba(8,19,27,.6)}
.statstrip div{padding:20px 16px;text-align:center;border-left:1px solid var(--line)}
.statstrip div:first-child{border-left:0}
.statstrip b{display:block;font:600 44px/1 var(--serif);color:var(--gold)}
.statstrip span{display:block;margin-top:6px;color:var(--muted);font-size:13.5px}
.statstrip em{font-style:normal;color:#8fa2a4;font-size:11px;margin-left:4px;border:1px solid var(--line);border-radius:6px;padding:0 5px}
.sec-h{display:flex;align-items:end;justify-content:space-between;gap:16px;margin:42px 0 14px}
.sec-h h2{font-size:36px}
.shelf{position:relative;padding:22px 22px 0;overflow-x:auto;scroll-snap-type:x proximity;scrollbar-width:thin;scrollbar-color:var(--line) transparent}
.shelf .row{display:flex;gap:16px;align-items:flex-end;min-width:min-content;padding-bottom:20px;position:relative}
.shelf .row>div,.shelf .row>button{flex:0 0 clamp(112px,11.2vw,138px);scroll-snap-align:start}
.shelf .row::after{content:"";position:absolute;left:-22px;right:-22px;bottom:56px;height:14px;background:linear-gradient(#6b4a2b,#3b2716 60%,#241709);box-shadow:0 8px 14px rgba(0,0,0,.5),inset 0 2px 0 rgba(255,220,160,.25);z-index:0}
.shelf .row>*{position:relative;z-index:1}
.shelfwrap .cap{margin-top:18px;height:32px;overflow:hidden}
.shelfwrap{position:relative;border-radius:16px;background:linear-gradient(180deg,rgba(8,19,27,.45),rgba(20,12,6,.55));border:1px solid #3b2d1e;overflow:hidden}
.shelfwrap .shelf{padding-bottom:10px}
.cap{font-size:12px;color:var(--muted);margin-top:6px;line-height:1.3}

/* shelves view */
.ctrls{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0 18px}
.ctrls input,.ctrls select{min-height:44px;padding:0 14px;background:rgba(20,44,53,.9);border:1px solid var(--line);border-radius:10px;color:var(--cream)}
.ctrls input{flex:1 1 260px}
.ctrls select option{background:#10232B}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:22px 16px}
.fbtn{display:none}
.more{display:block;margin:26px auto 0}

/* stats */
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:18px}
.card{padding:22px}
.card h3{font-size:28px;margin-bottom:14px}
.bar{display:grid;grid-template-columns:150px 1fr 44px;gap:10px;align-items:center;margin:7px 0;font-size:14px}
.bar .t{height:12px;background:rgba(41,70,76,.5);border-radius:6px;overflow:hidden}
.bar .t i{display:block;height:100%;background:var(--gold);border-radius:6px}
.bar span:last-child{text-align:right;color:var(--muted)}
table.dq{border-collapse:collapse;width:100%;font-size:14px}
table.dq td{padding:7px 0;border-bottom:1px solid var(--line)}
table.dq td:last-child{text-align:right;font-weight:600;color:var(--gold)}

/* detail drawer */
#scrim{position:fixed;inset:0;background:rgba(3,8,12,.55);z-index:60;opacity:0;pointer-events:none;transition:opacity .2s}
#scrim.on{opacity:1;pointer-events:auto}
#scrim.off{display:none}
#drawer{position:fixed;z-index:70;top:calc(var(--hdr) + var(--pv));right:0;bottom:0;width:min(420px,100%);background:rgba(11,27,35,.97);border-left:1px solid var(--line);padding:22px 22px 28px;overflow:auto;transform:translateX(105%);transition:transform .25s;visibility:hidden}
#drawer.on{transform:none;visibility:visible}
#drawer .x{position:absolute;top:10px;right:10px;width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--panel);font-size:22px;line-height:1}
#drawer .big{width:150px;margin:6px 0 14px}
#drawer h2{font-size:34px;margin:4px 0 2px}
#drawer .ser{font:italic 500 18px var(--serif);color:var(--gold)}
#drawer .au{color:var(--muted);margin-bottom:10px}
#drawer dl{display:grid;grid-template-columns:90px 1fr;gap:6px 12px;margin:14px 0;font-size:14.5px}
#drawer dt{color:var(--muted)}
#drawer dd{margin:0}
#drawer h4{margin:18px 0 6px;font:600 15px var(--sans);color:var(--gold)}
#drawer .txt{font-size:15px;color:#d8d3c4;white-space:pre-wrap}
.gd{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:7px;background:var(--c)}
.grab{display:none}

/* universe */
.uni{position:relative;height:calc(100dvh - var(--hdr) - var(--bot) - var(--pv));width:100vw;margin:-28px 0 -80px calc(50% - 50vw);overflow:hidden;background:radial-gradient(ellipse 70% 60% at 30% 20%,#13303a 0,#0b1d25 45%,#07121a 100%)}
.uni::before{content:"";position:absolute;inset:0;background-image:radial-gradient(rgba(232,184,95,.07) 1px,transparent 1.2px);background-size:34px 34px;pointer-events:none}
.uni canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:grab;outline-offset:-3px}
.uni canvas:active{cursor:grabbing}
.utop{position:absolute;z-index:5;left:16px;right:16px;top:14px;display:flex;flex-direction:column;gap:10px;pointer-events:none}
.utop>*{pointer-events:auto}
.utitle{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
.utitle h1{font-size:38px}
.utitle p{margin:0;color:var(--muted)}
.urow{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.sbox{position:relative;flex:0 1 380px;min-width:220px}
.sbox input{width:100%;min-height:44px;padding:0 14px;background:rgba(8,19,27,.9);border:1px solid var(--line);border-radius:10px;color:var(--cream)}
.sres{position:absolute;top:48px;left:0;right:0;background:#0d2029;border:1px solid var(--line);border-radius:10px;overflow:hidden;box-shadow:0 14px 30px rgba(0,0,0,.5);z-index:8}
.sres button{display:flex;gap:10px;align-items:center;width:100%;min-height:52px;padding:6px 12px;border:0;border-bottom:1px solid var(--line);background:none;text-align:left}
.sres button:hover,.sres button:focus-visible{background:var(--sel)}
.sres .cv{width:28px;flex:none}
.sres small{display:block;color:var(--muted)}
.rel{display:flex;gap:6px;flex-wrap:wrap}
.rel .chip{padding:0 14px 0 12px}
.sw{width:22px;height:4px;border-radius:2px;display:inline-block}
.fpanel{display:none;gap:10px;flex-wrap:wrap;padding:12px;background:rgba(8,19,27,.94);border:1px solid var(--line);border-radius:12px;max-width:760px}
.fpanel.on{display:flex}
.fpanel label{display:flex;flex-direction:column;gap:4px;font-size:12.5px;color:var(--muted);flex:1 1 150px}
.fpanel select{min-height:44px;padding:0 10px;background:var(--panel);border:1px solid var(--line);border-radius:8px;color:var(--cream)}
.zoomc{position:absolute;right:16px;bottom:20px;z-index:5;display:flex;flex-direction:column;gap:8px}
.zoomc button{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:rgba(8,19,27,.92);font-size:22px}
.legend{position:absolute;left:16px;bottom:18px;z-index:5;padding:12px 14px;font-size:12.5px;color:var(--muted);max-width:320px}
.legend div{display:flex;align-items:center;gap:8px;margin:3px 0}
.legend .ring{width:14px;height:14px;border:2px solid var(--gold);border-radius:3px}
.legend .dash{width:14px;height:14px;border:1.5px dashed #8fa2a4;border-radius:3px}
.utip{position:absolute;z-index:6;pointer-events:none;background:rgba(8,19,27,.95);border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:13px;max-width:260px;display:none}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#0d2029;border:1px solid var(--gold);color:var(--cream);padding:10px 16px;border-radius:10px;z-index:90;font-size:14px;display:none;max-width:90vw}

/* yearbook */
.ychips{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 10px;scrollbar-width:thin}
.ychips .chip{flex:none;flex-direction:column;gap:0;justify-content:center;padding:4px 18px;line-height:1.15}
.ychips .chip small{color:var(--muted);font-size:11.5px}
.ytop{display:grid;grid-template-columns:minmax(300px,470px) 1fr;gap:44px;align-items:center;margin-top:6px}
.ycover{position:relative;aspect-ratio:4/5;border-radius:6px;overflow:hidden;border:1px solid rgba(232,184,95,.55);box-shadow:0 30px 60px rgba(0,0,0,.6);background:linear-gradient(rgba(8,19,27,.35),rgba(8,19,27,.82)),url(data/library.webp) 30% center/cover}
.ycover::before{content:"";position:absolute;inset:12px;border:1px solid rgba(232,184,95,.45);pointer-events:none;z-index:3}
.ycover .mast{position:absolute;top:7%;left:0;right:0;text-align:center;z-index:2}
.ycover .mast small{display:block;font:500 13px var(--sans);color:var(--gold);letter-spacing:.14em;text-transform:uppercase}
.ycover .mast b{display:block;font:italic 600 34px/1.1 var(--serif);color:var(--cream);margin-top:4px}
.ycover .yr{position:absolute;top:19%;left:0;right:0;text-align:center;font:700 clamp(96px,14vw,168px)/.9 var(--serif);color:var(--cream);text-shadow:0 6px 30px rgba(0,0,0,.6);z-index:2}
.ycover .cnt{position:absolute;top:50%;left:0;right:0;text-align:center;font:500 20px var(--sans);color:var(--gold);z-index:2}
.fan{position:absolute;left:0;right:0;bottom:-3%;height:40%;display:flex;justify-content:center;align-items:flex-end;z-index:2}
.fan .cv{width:23%;margin:0 -3%;transform-origin:50% 100%;box-shadow:0 10px 22px rgba(0,0,0,.65);border:1px solid rgba(255,255,255,.12)}
.ytop .intro h1{font-size:clamp(40px,5vw,64px);margin:6px 0 12px}
.ytop .intro p{color:#d8d3c4;max-width:46ch}
.spread{margin-top:64px}
.spread>h2{font-size:clamp(34px,4vw,50px);margin-bottom:6px}
.kpis{display:grid;grid-template-columns:1.4fr 1fr 1fr;grid-template-rows:auto auto;gap:0;margin-top:22px;border-top:1px solid var(--line)}
.kpis>div{padding:22px 22px;border-bottom:1px solid var(--line);border-left:1px solid var(--line)}
.kpis>div:nth-child(3n+1){border-left:0}
.kpis .big{grid-row:span 2;display:flex;flex-direction:column;justify-content:center}
.kpis b{display:block;font:600 clamp(40px,5vw,64px)/1 var(--serif);color:var(--gold)}
.kpis .big b{font-size:clamp(96px,13vw,170px);color:var(--cream)}
.kpis span{display:block;color:var(--muted);font-size:14px;margin-top:6px}
.tlwrap{overflow-x:auto;margin-top:18px;padding-bottom:6px;scroll-snap-type:x proximity}
.tl{display:grid;grid-template-columns:repeat(12,minmax(74px,1fr));min-width:960px;align-items:end;border-bottom:3px solid #6b4a2b}
.tl .m{display:flex;flex-direction:column-reverse;align-items:center;padding:0 5px 10px;min-height:260px;border-left:1px solid rgba(41,70,76,.5)}
.tl .m:first-child{border-left:0}
.tl .m button{width:58px;margin-top:-50px}
.tl .m button:first-child{margin-top:0}
.tlinfo{display:grid;grid-template-columns:repeat(12,minmax(74px,1fr));min-width:960px;text-align:center;font-size:12.5px;color:var(--muted)}
.tlinfo div{padding:8px 4px;border-left:1px solid rgba(41,70,76,.5)}
.tlinfo div:first-child{border-left:0}
.tlinfo b{display:block;color:var(--cream);font:600 20px var(--serif)}
.gen{display:grid;grid-template-columns:1fr 1fr;gap:34px;margin-top:20px}
.ribbon{display:flex;height:34px;border-radius:8px;overflow:hidden;margin:14px 0}
.ribbon i{display:block;min-width:2px}
.gen .bar{grid-template-columns:170px 1fr 84px}
.bar span:last-child{white-space:nowrap}
.two{display:grid;grid-template-columns:1fr 1fr;gap:34px;margin-top:20px}
.minis{display:flex;gap:10px;margin-top:10px}
.minis .cv{width:64px}
.gnote{display:flex;gap:12px;align-items:flex-start;padding:14px 16px;border-left:3px solid var(--gold);background:rgba(232,184,95,.06);border-radius:0 10px 10px 0;margin:10px 0;font:italic 500 21px/1.35 var(--serif)}
.gnote .pill{flex:none;font:600 11px var(--sans);font-style:normal;margin-top:5px}
.boy{display:grid;grid-template-columns:200px 1fr;gap:30px;align-items:start;margin-top:18px;padding:28px}
.boy .cv{width:200px}
.boy h3{font-size:42px;margin:6px 0}
.boy .rv{margin-top:12px;padding-left:14px;border-left:2px solid var(--line);color:#d8d3c4;white-space:pre-wrap}
.soc{display:flex;gap:18px;overflow-x:auto;padding:12px 2px 18px;scroll-snap-type:x proximity}
.soc figure{margin:0;flex:none;scroll-snap-align:start}
.soc canvas{display:block;height:min(520px,70vh);width:auto;border-radius:6px;border:1px solid var(--line);box-shadow:0 14px 30px rgba(0,0,0,.5)}
.soc figcaption{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:8px;font-size:13.5px;color:var(--muted)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.seg button{min-height:44px;padding:0 16px;border:0;background:rgba(20,44,53,.8);border-left:1px solid var(--line)}
.seg button:first-child{border-left:0}
.seg button[aria-pressed=true]{background:var(--sel);color:var(--gold)}

/* settings */
.tog{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:16px 0;border-bottom:1px solid var(--line)}
.tog:last-child{border-bottom:0}

 .bottomnav svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
 main{padding:16px 14px calc(88px + env(safe-area-inset-bottom))}

 #drawer.on{transform:none}

<body>
<div class="room" aria-hidden="true"></div>
<header class="top">

  <nav class="main" aria-label="Primary">
    <a href="#home" data-v="home">Home</a><a href="#shelves" data-v="shelves">Shelves</a><a href="#stats" data-v="stats">Statistics</a><a href="#universe" data-v="universe">Universe</a><a href="#yearbook" data-v="yearbook">Yearbook</a><a href="#prefs" data-v="prefs">Settings</a>
  </nav>
  <a class="gear chip" href="#prefs" aria-label="Settings" style="display:none;margin-left:auto;padding:0 12px;min-width:44px;justify-content:center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"/></svg></a>
</header>
<nav class="bottomnav" aria-label="Primary">
  <a href="#home" data-v="home"><svg viewBox="0 0 24 24"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>Home</a>
  <a href="#shelves" data-v="shelves"><svg viewBox="0 0 24 24"><path d="M4 4h4v16H4zM10 4h4v16h-4zM16.5 5l3.7 1-3.6 14-3.8-1z"/></svg>Shelves</a>
  <a href="#universe" data-v="universe"><svg viewBox="0 0 24 24"><circle cx="6" cy="7" r="2.2"/><circle cx="18" cy="6" r="2.2"/><circle cx="12" cy="18" r="2.2"/><path d="M7.8 8.2l3 7.8M16.3 7.7L13 16M8 7h8"/></svg>Universe</a>
  <a href="#stats" data-v="stats"><svg viewBox="0 0 24 24"><path d="M5 20V10M12 20V4M19 20v-7"/></svg>Stats</a>
  <a href="#yearbook" data-v="yearbook"><svg viewBox="0 0 24 24"><path d="M5 4h11a3 3 0 0 1 3 3v13H8a3 3 0 0 1-3-3zM5 17a3 3 0 0 1 3-3h11"/></svg>Yearbook</a>
</nav>

<main id="main">
 <section class="view" id="v-home" aria-label="Home"></section>
 <section class="view" id="v-shelves" aria-label="Shelves"></section>
 <section class="view" id="v-stats" aria-label="Statistics"></section>
 <section class="view" id="v-universe" aria-label="The Universe"></section>
 <section class="view" id="v-yearbook" aria-label="The Reading Yearbook"></section>
 <section class="view" id="v-prefs" aria-label="Settings"></section>
</main>
<div id="scrim"></div>
<aside id="drawer" role="dialog" aria-modal="false" aria-label="Book details" aria-hidden="true"></aside>
<div class="toast" id="toast" role="status"></div>
<div class="sr" aria-live="polite" id="live"></div>

<script src="data/lib.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<script>
/* ========== basics ========== */
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const GC={"High Fantasy":"#3B4F6B","Fantasy Adventure":"#7A5C2E","Romantasy":"#8A3F55","Contemporary Fantasy":"#5B4A78","Sci-Fi":"#2E6670","Dystopian":"#5A5F63","LitRPG":"#8F4B2A","Mystery":"#3F3F58","Horror":"#6E2A2A","Contemporary Fiction":"#4F6B52","Classics":"#6B5A3C","Nonfiction":"#46606E","Poetry":"#805B7A","Mythological Retellings":"#85692B","Romance":"#9B3D4A"};
const MONTHS=['January','February','March','April','May','June','July','August','September','October','November','December'];
const PPH=35;
const PREF={reduce:false,genreLines:false};
try{Object.assign(PREF,JSON.parse(localStorage.getItem('rr-prefs')||'{}'))}catch(e){}
const savePrefs=()=>{try{localStorage.setItem('rr-prefs',JSON.stringify(PREF))}catch(e){}};
const mqR=matchMedia('(prefers-reduced-motion: reduce)');
const reduced=()=>PREF.reduce||mqR.matches;
const applyMotion=()=>document.documentElement.dataset.motion=PREF.reduce?'reduced':'';
applyMotion();
const byId=Object.fromEntries(LIB.map(b=>[b.id,b]));
const norm=s=>String(s||'').toLowerCase().replace(/\s+/g,' ').trim();
const fmtDate=d=>{if(!d)return'';const [y,m,dd]=d.split('-');return new Date(+y,+m-1,+dd||1).toLocaleDateString('en-US',{month:'long',day:'numeric',year:'numeric'})};
const num=n=>n.toLocaleString('en-US');
const serTxt=b=>b.se?(b.se+(b.sn?' #'+b.sn:'')):'';
function toast(t){const e=$('#toast');e.textContent=t;e.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display='none',3200)}
function cv(b,st=''){const col=b.ap%12,row=Math.floor(b.ap/12);return `<div class="cv" role="img" aria-label="${esc(b.t)} by ${esc(b.a)}" style="--c:${GC[b.g]||'#3B4F6B'};${st}"><span class="ft">${esc(b.t)}</span><span class="sp" style="background-image:url(data/atlas${b.at}.webp);background-position:${col/11*100}% ${row/13*100}%"></span></div>`}
function stars(r){return r>0?`<span class="stars" role="img" aria-label="${r} out of 5 stars">★★★★★<i style="width:${r/5*100}%">★★★★★</i></span>`:'<span class="note">Unrated</span>'}

/* ========== date reliability ========== */
const daCount={};LIB.forEach(b=>{if(b.da)daCount[b.da]=(daCount[b.da]||0)+1});
const BULK=new Set(Object.keys(daCount).filter(k=>daCount[k]>=20));
LIB.forEach(b=>{b.ds=b.sh!=='read'?'na':!b.dr?'none':(+b.dr.slice(0,4)<2017?'pre':(BULK.has(b.dr)?'bulk':'ok'));b.yr=b.ds==='ok'?+b.dr.slice(0,4):0});
const READ=LIB.filter(b=>b.sh==='read');
const REL=LIB.filter(b=>b.ds==='ok');
const YEARS=[...new Set(REL.map(b=>b.yr))].sort((a,b)=>a-b);

/* ========== routing ========== */
const VIEWS=['home','shelves','stats','universe','yearbook','prefs'];
const inited={};
function route(){let v=location.hash.slice(1);if(!VIEWS.includes(v))v='home';
 $$('section.view').forEach(s=>s.classList.toggle('on',s.id==='v-'+v));
 $$('[data-v]').forEach(a=>a.getAttribute('data-v')===v?a.setAttribute('aria-current','page'):a.removeAttribute('aria-current'));
 closeDrawer(true);
 if(!inited[v]){inited[v]=true;({home:initHome,shelves:initShelves,stats:initStats,universe:initUniverse,yearbook:initYearbook,prefs:initPrefs})[v]()}
 if(v==='universe')requestAnimationFrame(()=>U.resize&&U.resize());
 if(v==='yearbook')requestAnimationFrame(()=>drawSocial&&YB.ready&&drawSocial());
 window.scrollTo(0,0);document.title=({home:'Home',shelves:'Shelves',stats:'Statistics',universe:'The Universe',yearbook:'The Reading Yearbook',prefs:'Settings'})[v]+' · Joey\'s Reading Room';
}
addEventListener('hashchange',route);

/* ========== detail drawer ========== */
let DR={id:null,explore:false,onExplore:null};
function openDetail(id,opt={}){const b=byId[id];if(!b)return;DR={id,...opt};
 const fin=b.ds==='ok'?`<dt>Finished</dt><dd>${fmtDate(b.dr)}</dd>`:(b.sh==='read'?`<dt>Finished</dt><dd class="note" style="font-size:14px">Date not tracked</dd>`:'');
 const status={read:'Read','currently-reading':'Currently reading','to-read':'To read','did-not-finish':'Did not finish'}[b.sh]||b.sh;
 $('#drawer').innerHTML=`<span class="grab" aria-hidden="true"></span><button class="x" aria-label="Close details">×</button><div class="dtop"><div class="big">${cv(b)}</div><div>${b.se?`<div class="ser">${esc(serTxt(b))}</div>`:''}<h2>${esc(b.t)}</h2><div class="au">${esc(b.a)}</div><div>${stars(b.r)}</div>
 ${opt.explore?`<div style="margin:12px 0 2px"><button class="btn" id="exploreBtn">Explore connections</button></div>`:''}</div></div>
 <dl><dt>Status</dt><dd>${status}</dd><dt>Genre</dt><dd><span class="gd" style="--c:${GC[b.g]||'#999'}"></span>${esc(b.g||'Unsorted')}</dd><dt>Pages</dt><dd>${b.p||'Unknown'}</dd><dt>Published</dt><dd>${b.y||'Unknown'}</dd>${fin}</dl>
 ${b.rv&&b.rv.trim()?`<h4>My review</h4><div class="txt">${esc(b.rv.replace(/<br\s*\/?>/gi,'\n'))}</div>`:''}
 ${b.sm?`<h4>Summary</h4><div class="txt">${esc(b.sm)}</div>`:''}`;
 const d=$('#drawer');d.classList.add('on');d.setAttribute('aria-hidden','false');d.scrollTop=0;
 const sc=$('#scrim');sc.classList.toggle('off',!!opt.noScrim);sc.classList.toggle('on',!opt.noScrim);
 $('#drawer .x').onclick=()=>closeDrawer();
 const eb=$('#exploreBtn');if(eb)eb.onclick=()=>opt.onExplore&&opt.onExplore(id);
 if(innerWidth<=860){document.documentElement.style.setProperty('--sheet',d.offsetHeight+'px');const u=$('#uni');u&&u.classList.add('sh')}
 $('#live').textContent='Showing details for '+b.t;
}
function closeDrawer(quiet){const d=$('#drawer');d.classList.remove('on');d.setAttribute('aria-hidden','true');$('#scrim').classList.remove('on');document.documentElement.style.setProperty('--sheet','0px');{const u=$('#uni');u&&u.classList.remove('sh')}if(!quiet&&DR.onClose)DR.onClose();}
$('#scrim').onclick=()=>closeDrawer();
addEventListener('keydown',e=>{if(e.key==='Escape'&&$('#drawer').classList.contains('on'))closeDrawer()});

/* ========== HOME ========== */
function initHome(){
 const cur=LIB.find(b=>b.sh==='currently-reading');
 const authors=new Set(READ.map(b=>b.a)).size,pages=READ.reduce((s,b)=>s+b.p,0),rated=READ.filter(b=>b.r>0),avg=rated.reduce((s,b)=>s+b.r,0)/rated.length;
 const recent=REL.slice().sort((a,b)=>b.dr.localeCompare(a.dr)||a.t.localeCompare(b.t)).slice(0,16);
 $('#v-home').innerHTML=`
 <div class="hero"><div class="htext"><h1>Reading, Collected.</h1><p class="lead">A personal archive of books, ratings, and reading history.</p>  <div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:22px"><a class="btn" href="#universe">Enter the Universe</a><a class="btn ghost" href="#yearbook">Open the Yearbook</a></div></div>
  <div>${cur?`<button class="now" data-id="${cur.id}" aria-label="Open details for ${esc(cur.t)}">${cv(cur)}<div><span class="pill">Currently reading</span><h2>${esc(cur.t)}</h2><div class="by">${esc(cur.a)}${cur.se?` &nbsp;|&nbsp; <i>${esc(serTxt(cur))}</i>`:''}</div></div></button>`:`<div class="now"><div><span class="pill">Nothing on the nightstand</span><h2>No current book</h2><div class="by">Mark a book as currently reading in Goodreads and it will appear here.</div></div></div>`}</div></div>
 <div class="statstrip" role="list">
  <div role="listitem"><b>${num(READ.length)}</b><span>books read</span></div>
  <div role="listitem"><b>${num(authors)}</b><span>authors read</span></div>
  <div role="listitem"><b>${num(pages)}</b><span>pages read</span></div>
  <div role="listitem"><b>${num(Math.round(pages/PPH))}</b><span>hours listened<em>est.</em></span></div>
  <div role="listitem"><b>${avg.toFixed(2)}<small style="font:600 26px var(--sans);margin-left:4px">★</small></b><span>average rating, ${rated.length} rated</span></div></div>
  <div class="sec-h"><div><div class="eyebrow">Recently finished</div><h2>The latest on the shelf</h2></div><a class="btn ghost" href="#shelves">Browse all shelves</a></div>
 <div class="shelfwrap"><div class="shelf" tabindex="0" aria-label="Recently finished books, scroll sideways"><div class="row">${recent.map(b=>`<button class="cvb" data-id="${b.id}" aria-label="${esc(b.t)}">${cv(b)}<div class="cap">${esc(b.t.length>34?b.t.slice(0,32)+'…':b.t)}</div></button>`).join('')}</div></div></div>`;
 $$('#v-home [data-id]').forEach(e=>e.onclick=()=>openDetail(e.dataset.id));
}


/* ========== SHELVES ========== */
const SH={q:'',g:'',st:'read',sort:'recent',n:96};
function initShelves(){
 const gs=[...new Set(LIB.map(b=>b.g).filter(Boolean))].sort();
 $('#v-shelves').innerHTML=`<div class="eyebrow">Shelves</div><h1 style="font-size:clamp(38px,5vw,60px)">Every book, shelf by shelf</h1>
 <div class="ctrls" id="sctrls"><input id="sq" type="search" placeholder="Search title, author, series, review" aria-label="Search books"><button class="chip fbtn" id="sfb" aria-expanded="false">Filters</button>
  <select class="fx" id="sg" aria-label="Genre"><option value="">All genres</option>${gs.map(g=>`<option>${esc(g)}</option>`).join('')}</select>
  <select class="fx" id="sst" aria-label="Shelf"><option value="read">Read</option><option value="currently-reading">Currently reading</option><option value="to-read">To read</option><option value="did-not-finish">Did not finish</option><option value="">All shelves</option></select>
  <select class="fx" id="so" aria-label="Sort"><option value="recent">Recently finished</option><option value="title">Title</option><option value="author">Author</option><option value="rating">Rating</option></select></div>
 <div class="note" id="scount" aria-live="polite"></div><div class="grid" id="sgrid" style="margin-top:14px"></div><button class="btn ghost more" id="smore">Show more</button>`;
 $('#sq').oninput=e=>{SH.q=e.target.value;SH.n=96;shRender()};$('#sg').onchange=e=>{SH.g=e.target.value;SH.n=96;shRender()};$('#sst').onchange=e=>{SH.st=e.target.value;SH.n=96;shRender()};$('#so').onchange=e=>{SH.sort=e.target.value;SH.n=96;shRender()};
 $('#sfb').onclick=()=>{const o=$('#sctrls').classList.toggle('open');$('#sfb').setAttribute('aria-expanded',o)};
 $('#smore').onclick=()=>{SH.n+=96;shRender()};shRender();
}
function shRender(){const q=norm(SH.q);
 let l=LIB.filter(b=>(!SH.g||b.g===SH.g)&&(!SH.st||b.sh===SH.st)&&(!q||norm(b.t+' '+b.a+' '+b.se+' '+b.rv).includes(q)));
 const s=SH.sort;l.sort((a,b)=>s==='title'?a.t.localeCompare(b.t):s==='author'?a.a.localeCompare(b.a):s==='rating'?b.r-a.r||a.t.localeCompare(b.t):((b.dr||'').localeCompare(a.dr||'')||a.t.localeCompare(b.t)));
 $('#scount').textContent=l.length+' books';
 $('#sgrid').innerHTML=l.slice(0,SH.n).map(b=>`<button class="cvb" data-id="${b.id}" aria-label="${esc(b.t)} by ${esc(b.a)}">${cv(b)}</button>`).join('');
 $$('#sgrid [data-id]').forEach(e=>e.onclick=()=>openDetail(e.dataset.id));$('#smore').style.display=l.length>SH.n?'block':'none';
}

/* ========== STATS ========== */
function bars(rows,max,col){return rows.map(([l,v,x])=>`<div class="bar"><span>${esc(l)}</span><span class="t"><i style="width:${v/max*100}%;${col?'background:'+(col[l]||'var(--gold)'):''}"></i></span><span>${x==null?v:x}</span></div>`).join('')}
function initStats(){
 const gc={};READ.forEach(b=>{if(b.g)gc[b.g]=(gc[b.g]||0)+1});const gl=Object.entries(gc).sort((a,b)=>b[1]-a[1]);
 const yc={};REL.forEach(b=>yc[b.yr]=(yc[b.yr]||0)+1);
 const rc={};READ.forEach(b=>{if(b.r>0)rc[Math.round(b.r)]=(rc[Math.round(b.r)]||0)+1});
 const count=(arr,f)=>{const m={};arr.forEach(b=>{const k=f(b);m[k]=(m[k]||0)+1});return m};
 const au=Object.entries(count(READ,b=>b.a)).sort((a,b)=>b[1]-a[1]||a[0].localeCompare(b[0])).slice(0,9);
 const era=y=>y<1900?'Before 1900':y<1950?'1900–1949':y<1980?'1950–1979':y<2000?'1980–1999':y<2010?'2000s':y<2020?'2010s':'2020s';
 const eo=['Before 1900','1900–1949','1950–1979','1980–1999','2000s','2010s','2020s'],ec=count(READ.filter(b=>b.y),b=>era(b.y)),er=eo.map(k=>[k,ec[k]||0]).reverse();
 /* reader profile, written in Joey's voice from the reliably dated recent reading */
 const rated=READ.filter(b=>b.r>0),rec=REL.filter(b=>b.yr>=2020),recRated=rec.filter(b=>b.r>0);
 const pct=(n,d)=>Math.round(n/(d||1)*100);
 const about=p=>{const m={50:'half',33:'a third',67:'two in three',75:'three in four',25:'a quarter'};let r=null;for(const k in m)if(Math.abs(p-k)<=3)r=m[k];return r?'about '+r:p+'%'};
 const list=a=>a.length<2?a.join(''):a.slice(0,-1).join(', ')+' and '+a[a.length-1];
 const rk=(arr,f)=>Object.entries(count(arr,f)).sort((a,b)=>b[1]-a[1]).map(e=>e[0]);
 const rg=rk(rec,b=>b.g),ra=rk(rec.filter(b=>!/applegate/i.test(b.a)),b=>b.a).slice(0,4).map(esc),rs=rk(rec.filter(b=>b.se),b=>b.se).slice(0,4).map(esc);
